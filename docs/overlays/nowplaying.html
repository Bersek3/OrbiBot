<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>OBS Now Playing Song Overlay</title>
  <link rel="stylesheet" href="../css/overlays.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
</head>
<body>
  <div class="np-container">
    <div id="npCard" class="np-card">
      <div class="np-thumb-wrapper">
        <img id="npThumb" class="np-thumb" src="" alt="Album Cover">
      </div>
      <div class="np-info">
        <div class="np-tag">
          <span>NOW PLAYING</span>
          <div class="np-equalizer">
            <div class="np-bar"></div>
            <div class="np-bar"></div>
            <div class="np-bar"></div>
            <div class="np-bar"></div>
          </div>
        </div>
        <div id="npTitle" class="np-title">Esperando canciones...</div>
        <div id="npRequester" class="np-requester">Pedida por <strong>Streamer</strong></div>
      </div>
    </div>
  </div>

  <!-- Reproductor oculto de YouTube para emitir audio directamente en OBS -->
  <div id="obsYtContainer" style="position: fixed; top: -9999px; left: -9999px; width: 1px; height: 1px; opacity: 0; pointer-events: none;">
    <div id="obsYtPlayer"></div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const npCard = document.getElementById('npCard');
    const npThumb = document.getElementById('npThumb');
    const npTitle = document.getElementById('npTitle');
    const npRequester = document.getElementById('npRequester');

    const urlParams = new URLSearchParams(window.location.search);
    // El audio ahora se emite con el widget dedicado music_player.html para tener control de volumen independiente en OBS.
    // En nowplaying.html solo se activará si se pasa explícitamente ?audio=1.
    const enableAudio = urlParams.get('audio') === '1';

    let ytPlayer = null;
    let ytApiReady = false;
    let pendingVideoId = null;

    window.onYouTubeIframeAPIReady = function() {
      if (!enableAudio) return;
      ytPlayer = new YT.Player('obsYtPlayer', {
        height: '200',
        width: '200',
        playerVars: {
          autoplay: 1,
          controls: 0,
          disablekb: 1,
          fs: 0,
          rel: 0
        },
        events: {
          onReady: (event) => {
            ytApiReady = true;
            if (pendingVideoId) {
              playYouTubeVideo(pendingVideoId);
              pendingVideoId = null;
            }
          },
          onStateChange: (event) => {
            // YT.PlayerState.ENDED is 0
            if (event.data === 0) {
              fetch('/api/sr/skip', { method: 'POST' }).catch(() => {});
            }
          },
          onError: (event) => {
            console.warn('YouTube OBS Player error, skipping:', event.data);
            setTimeout(() => {
              fetch('/api/sr/skip', { method: 'POST' }).catch(() => {});
            }, 3000);
          }
        }
      });
    };

    function playYouTubeVideo(videoId) {
      if (!enableAudio || !videoId) return;
      if (ytPlayer && ytApiReady && ytPlayer.loadVideoById) {
        try {
          ytPlayer.loadVideoById(videoId);
          ytPlayer.playVideo();
        } catch(e) {}
      } else {
        pendingVideoId = videoId;
      }
    }

    function stopYouTubeVideo() {
      pendingVideoId = null;
      if (ytPlayer && ytPlayer.stopVideo) {
        try { ytPlayer.stopVideo(); } catch(e) {}
      }
    }

    function updateSong(song) {
      if (!song) {
        npCard.classList.remove('visible');
        stopYouTubeVideo();
        return;
      }

      npThumb.src = song.thumbnail || 'https://i.ytimg.com/vi/dQw4w9WgXcQ/hqdefault.jpg';
      npTitle.innerText = song.title || 'Canción desconocida';
      npRequester.innerHTML = `Pedida por <strong>@${song.requester || 'Anónimo'}</strong>`;
      npCard.classList.add('visible');

      if (song.videoId) {
        playYouTubeVideo(song.videoId);
      }
    }

    // Initial check from localStorage or API
    try {
      const saved = localStorage.getItem('orbibot_current_song');
      if (saved) updateSong(JSON.parse(saved));
    } catch(e) {}

    fetch('/api/sr/state')
      .then(r => r.json())
      .then(state => {
        if (state.currentSong && state.isPlaying) {
          updateSong(state.currentSong);
        }
      })
      .catch(() => {});

    function handleIncomingMessage(msg) {
      if (!msg) return;
      if (msg.event === 'init_state' && msg.data?.srState?.currentSong) {
        updateSong(msg.data.srState.currentSong);
      } else if (msg.event === 'sr_update') {
        const update = msg.data;
        if (update.action === 'play') {
          updateSong(update.data);
        } else if (update.action === 'skip') {
          updateSong(update.data?.current);
        } else if (update.action === 'stop') {
          updateSong(null);
        }
      }
    }

    function connectChannels() {
      const urlParams = new URLSearchParams(window.location.search);
      const channel = (urlParams.get('channel') || '').toLowerCase().replace(/^#/, '');
      const token = (urlParams.get('token') || urlParams.get('key') || '').trim();

      // 1. Local WebSocket con reconexión automática en segundo plano
      let wsInstance = null;
      let wsReconnectTimeout = null;

      function connectLocalWs(url) {
        if (wsReconnectTimeout) clearTimeout(wsReconnectTimeout);
        try {
          wsInstance = new WebSocket(url);
          wsInstance.onmessage = (event) => {
            try { handleIncomingMessage(JSON.parse(event.data)); } catch(e) {}
          };
          wsInstance.onerror = () => scheduleWsReconnect(url);
          wsInstance.onclose = () => scheduleWsReconnect(url);
        } catch(e) {
          scheduleWsReconnect(url);
        }
      }

      function scheduleWsReconnect(url) {
        if (wsReconnectTimeout) clearTimeout(wsReconnectTimeout);
        wsReconnectTimeout = setTimeout(() => {
          connectLocalWs(url);
        }, 3000);
      }

      const isGitHubPages = location.hostname.endsWith('github.io');
      const wsUrl = !isGitHubPages
        ? `${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}`
        : 'ws://localhost:3000';

      connectLocalWs(wsUrl);

      // 2. Cloud Real-time Relay (Paho MQTT) con reconexión automática
      let mqttClient = null;
      let mqttReconnectTimeout = null;

      function connectMqtt() {
        if (typeof Paho !== 'undefined') {
          if (mqttReconnectTimeout) clearTimeout(mqttReconnectTimeout);

          const relayChannel = channel || 'general';
          const clientId = 'orbi_np_' + Math.random().toString(36).substring(2, 9);
          try {
            mqttClient = new Paho.MQTT.Client('broker.emqx.io', 8084, clientId);
            mqttClient.onConnectionLost = (responseObject) => {
              console.warn('MQTT Connection lost, reconnecting in 3.5s...', responseObject);
              scheduleMqttReconnect();
            };
            mqttClient.onMessageArrived = (message) => {
              try {
                const payload = JSON.parse(message.payloadString);
                handleIncomingMessage(payload);
              } catch(e) {}
            };
            mqttClient.connect({
              useSSL: true,
              timeout: 6,
              keepAliveInterval: 30,
              onSuccess: () => {
                if (token && relayChannel !== 'general') {
                  mqttClient.subscribe(`orbibot/${relayChannel}_${token}/events`);
                }
                mqttClient.subscribe(`orbibot/${relayChannel}/events`);
              },
              onFailure: (e) => {
                console.warn('MQTT connect failed, retrying in 4s...', e);
                scheduleMqttReconnect();
              }
            });
          } catch(e) {
            scheduleMqttReconnect();
          }
        }
      }

      function scheduleMqttReconnect() {
        if (mqttReconnectTimeout) clearTimeout(mqttReconnectTimeout);
        mqttReconnectTimeout = setTimeout(connectMqtt, 3500);
      }

      connectMqtt();

      // 3. BroadcastChannel & Storage for same-browser testing
      if (typeof BroadcastChannel !== 'undefined') {
        const bc = new BroadcastChannel('orbibot_stream_channel');
        bc.onmessage = (e) => handleIncomingMessage(e.data);
      }

      window.addEventListener('storage', (e) => {
        if (e.key === 'orbibot_last_event' && e.newValue) {
          try { handleIncomingMessage(JSON.parse(e.newValue)); } catch (err) {}
        }
      });

      // 4. OBS Scene Activate & Visibility Health Watcher
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
          if (!wsInstance || wsInstance.readyState !== WebSocket.OPEN) {
            connectLocalWs(wsUrl);
          }
          if (!mqttClient || !mqttClient.isConnected()) {
            connectMqtt();
          }
        }
      });

      // 5. Chequeo periódico de salud en segundo plano cada 15s
      setInterval(() => {
        const wsOpen = wsInstance && wsInstance.readyState === WebSocket.OPEN;
        const mqttOpen = mqttClient && mqttClient.isConnected();
        if (!wsOpen && !mqttOpen) {
          connectLocalWs(wsUrl);
          connectMqtt();
        }
      }, 15000);
    }

    connectChannels();
  </script>
</body>
</html>
