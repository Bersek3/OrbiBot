<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>OBS Chat Overlay</title>
  <link rel="stylesheet" href="../css/overlays.css">
  <script src="https://cdn.jsdelivr.net/npm/tmi.js@1.8.5/dist/tmi.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
</head>
<body>
  <div id="chatContainer" class="chat-container"></div>

  <script>
    const chatContainer = document.getElementById('chatContainer');
    const MAX_MESSAGES = 15;

    function addMessage(data) {
      if (!data || !data.message) return;
      const bubble = document.createElement('div');
      bubble.className = 'chat-bubble';

      if (data.isMod) {
        bubble.style.borderLeftColor = '#00f2fe';
      }

      let badgeHtml = '';
      if (data.badges?.broadcaster) badgeHtml += '<span class="user-badge" style="background:#e91e63">STREAMER</span>';
      else if (data.isMod) badgeHtml += '<span class="user-badge" style="background:#00f2fe;color:#000">MOD</span>';
      else if (data.isSub) badgeHtml += '<span class="user-badge" style="background:#9146ff">SUB</span>';

      bubble.innerHTML = `
        <div>
          ${badgeHtml}
          <span class="username" style="color: ${data.color || '#9146ff'}">${data.user}:</span>
          <span class="text">${escapeHtml(data.message)}</span>
        </div>
      `;

      chatContainer.appendChild(bubble);

      while (chatContainer.children.length > MAX_MESSAGES) {
        chatContainer.removeChild(chatContainer.firstChild);
      }

      setTimeout(() => {
        bubble.style.transition = 'opacity 0.8s ease, transform 0.8s ease';
        bubble.style.opacity = '0';
        bubble.style.transform = 'translateY(-10px)';
        setTimeout(() => {
          if (bubble.parentNode) bubble.parentNode.removeChild(bubble);
        }, 800);
      }, 20000);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function handleIncomingMessage(msg) {
      if (!msg) return;
      if (msg.event === 'chat_message') {
        addMessage(msg.data);
      }
    }

    function connectChannels() {
      const urlParams = new URLSearchParams(window.location.search);
      const channel = (urlParams.get('channel') || '').toLowerCase().replace(/^#/, '');

      // 1. Direct Twitch IRC (native in OBS without external server)
      if (channel && window.tmi) {
        try {
          const tmiClient = new window.tmi.Client({
            connection: { reconnect: true, secure: true },
            channels: [channel]
          });
          tmiClient.connect().catch(console.error);

          tmiClient.on('message', (ch, tags, message, self) => {
            if (self) return;
            const username = tags['display-name'] || tags.username;
            const isMod = tags.mod || tags.badges?.broadcaster === '1';
            const isSub = tags.subscriber || tags.badges?.subscriber !== undefined;
            const userColor = tags.color || '#9146ff';

            addMessage({
              user: username,
              color: userColor,
              message,
              isMod,
              isSub,
              badges: tags.badges || {}
            });
          });
        } catch(e) {}
      }

      // 2. Cloud Real-time Relay (Paho MQTT)
      if (typeof Paho !== 'undefined') {
        const relayChannel = channel || 'general';
        const clientId = 'orbi_chat_' + Math.random().toString(36).substring(2, 9);
        try {
          const mqttClient = new Paho.MQTT.Client('broker.emqx.io', 8084, clientId);
          mqttClient.onMessageArrived = (message) => {
            try {
              const payload = JSON.parse(message.payloadString);
              handleIncomingMessage(payload);
            } catch(e) {}
          };
          mqttClient.connect({
            useSSL: true,
            timeout: 6,
            onSuccess: () => {
              mqttClient.subscribe(`orbibot/${relayChannel}/events`);
            }
          });
        } catch(e) {}
      }

      // 3. Local WebSocket Server
      function connectLocalWs(url) {
        try {
          const ws = new WebSocket(url);
          ws.onmessage = (event) => {
            try { handleIncomingMessage(JSON.parse(event.data)); } catch(e) {}
          };
        } catch(e) {}
      }

      const isGitHubPages = location.hostname.endsWith('github.io');
      if (!isGitHubPages) {
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        connectLocalWs(`${protocol}//${location.host}`);
      } else {
        connectLocalWs('ws://localhost:3000');
        connectLocalWs('ws://127.0.0.1:3000');
      }

      // 4. BroadcastChannel & Storage for same-browser testing
      if (typeof BroadcastChannel !== 'undefined') {
        const bc = new BroadcastChannel('orbibot_stream_channel');
        bc.onmessage = (e) => handleIncomingMessage(e.data);
      }

      window.addEventListener('storage', (e) => {
        if (e.key === 'orbibot_last_event' && e.newValue) {
          try { handleIncomingMessage(JSON.parse(e.newValue)); } catch (err) {}
        }
      });
    }

    connectChannels();
  </script>
</body>
</html>
