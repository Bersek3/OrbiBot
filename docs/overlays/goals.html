<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>OBS Goal Widget Overlay</title>
  <link rel="stylesheet" href="../css/overlays.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
</head>
<body>
  <div class="goal-container">
    <div class="goal-card">
      <div class="goal-header">
        <span id="goalTitle" class="goal-title">Meta de Suscriptores</span>
        <span class="goal-numbers">
          <span id="goalCurrent">0</span> / <span id="goalTarget">50</span>
        </span>
      </div>
      <div class="goal-bar-bg">
        <div id="goalFill" class="goal-bar-fill"></div>
      </div>
      <div class="goal-footer">
        <span id="goalPercent" class="goal-percent">0%</span>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const goalType = urlParams.get('type') || 'subs';
    const channel = (urlParams.get('channel') || '').toLowerCase().replace(/^#/, '');
    const token = (urlParams.get('token') || urlParams.get('key') || '').trim();

    const goalTitle = document.getElementById('goalTitle');
    const goalCurrent = document.getElementById('goalCurrent');
    const goalTarget = document.getElementById('goalTarget');
    const goalFill = document.getElementById('goalFill');
    const goalPercent = document.getElementById('goalPercent');

    function updateGoalDisplay(goal) {
      if (!goal) return;
      goalTitle.innerText = goal.title || 'Meta del Stream';
      goalCurrent.innerText = goal.current || 0;
      goalTarget.innerText = goal.target || 100;

      const current = Number(goal.current) || 0;
      const target = Number(goal.target) || 1;
      const pct = Math.min(100, Math.round((current / target) * 100));

      goalFill.style.width = `${pct}%`;
      goalPercent.innerText = `${pct}%`;

      if (goal.color) {
        goalFill.style.background = `linear-gradient(90deg, ${goal.color}, #00f2fe)`;
      }
    }

    // Load initial
    try {
      const saved = localStorage.getItem('orbibot_goals');
      if (saved) {
        const parsed = JSON.parse(saved);
        if (parsed[goalType]) updateGoalDisplay(parsed[goalType]);
      }
    } catch(e) {}

    fetch('/api/config')
      .then(r => r.json())
      .then(cfg => {
        if (cfg.goals && cfg.goals[goalType]) {
          updateGoalDisplay(cfg.goals[goalType]);
        }
      })
      .catch(() => {});

    function handleIncomingMessage(msg) {
      if (!msg) return;
      if (msg.event === 'init_state' && msg.data?.goals) {
        updateGoalDisplay(msg.data.goals[goalType]);
      } else if (msg.event === 'goal_update' && msg.data?.type === goalType) {
        updateGoalDisplay(msg.data.goal);
      } else if (msg.event === 'alert') {
        if ((goalType === 'subs' && msg.data?.type === 'sub') ||
            (goalType === 'followers' && msg.data?.type === 'follower')) {
          const cur = parseInt(goalCurrent.innerText, 10) + 1;
          goalCurrent.innerText = cur;
          updateGoalDisplay({ title: goalTitle.innerText, current: cur, target: parseInt(goalTarget.innerText, 10) });
        } else if (goalType === 'bits' && msg.data?.type === 'bits') {
          const cur = parseInt(goalCurrent.innerText, 10) + (msg.data.amount || 0);
          goalCurrent.innerText = cur;
          updateGoalDisplay({ title: goalTitle.innerText, current: cur, target: parseInt(goalTarget.innerText, 10) });
        }
      }
    }

    function connectChannels() {
      // 1. Local WebSocket con reconexión automática en segundo plano
      let wsInstance = null;
      let wsReconnectTimeout = null;

      function connectLocalWs(url) {
        if (wsReconnectTimeout) clearTimeout(wsReconnectTimeout);
        try {
          wsInstance = new WebSocket(url);
          wsInstance.onmessage = (event) => {
            try { handleIncomingMessage(JSON.parse(event.data)); } catch(e) {}
          };
          wsInstance.onerror = () => scheduleWsReconnect(url);
          wsInstance.onclose = () => scheduleWsReconnect(url);
        } catch(e) {
          scheduleWsReconnect(url);
        }
      }

      function scheduleWsReconnect(url) {
        if (wsReconnectTimeout) clearTimeout(wsReconnectTimeout);
        wsReconnectTimeout = setTimeout(() => {
          connectLocalWs(url);
        }, 3000);
      }

      const isGitHubPages = location.hostname.endsWith('github.io');
      const wsUrl = !isGitHubPages
        ? `${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}`
        : 'ws://localhost:3000';

      connectLocalWs(wsUrl);

      // 2. Cloud Real-time Relay (Paho MQTT) con reconexión automática
      let mqttClient = null;
      let mqttReconnectTimeout = null;

      function connectMqtt() {
        if (typeof Paho !== 'undefined') {
          if (mqttReconnectTimeout) clearTimeout(mqttReconnectTimeout);

          const relayChannel = channel || 'general';
          const clientId = 'orbi_goal_' + Math.random().toString(36).substring(2, 9);
          try {
            mqttClient = new Paho.MQTT.Client('broker.emqx.io', 8084, clientId);
            mqttClient.onConnectionLost = (responseObject) => {
              console.warn('MQTT Connection lost, reconnecting in 3.5s...', responseObject);
              scheduleMqttReconnect();
            };
            mqttClient.onMessageArrived = (message) => {
              try {
                const payload = JSON.parse(message.payloadString);
                handleIncomingMessage(payload);
              } catch(e) {}
            };
            mqttClient.connect({
              useSSL: true,
              timeout: 6,
              keepAliveInterval: 30,
              onSuccess: () => {
                if (token && relayChannel !== 'general') {
                  mqttClient.subscribe(`orbibot/${relayChannel}_${token}/events`);
                }
                mqttClient.subscribe(`orbibot/${relayChannel}/events`);
              },
              onFailure: (e) => {
                console.warn('MQTT connect failed, retrying in 4s...', e);
                scheduleMqttReconnect();
              }
            });
          } catch(e) {
            scheduleMqttReconnect();
          }
        }
      }

      function scheduleMqttReconnect() {
        if (mqttReconnectTimeout) clearTimeout(mqttReconnectTimeout);
        mqttReconnectTimeout = setTimeout(connectMqtt, 3500);
      }

      connectMqtt();

      // 3. BroadcastChannel & Storage for same-browser testing
      if (typeof BroadcastChannel !== 'undefined') {
        const bc = new BroadcastChannel('orbibot_stream_channel');
        bc.onmessage = (e) => handleIncomingMessage(e.data);
      }

      window.addEventListener('storage', (e) => {
        if (e.key === 'orbibot_last_event' && e.newValue) {
          try { handleIncomingMessage(JSON.parse(e.newValue)); } catch (err) {}
        }
      });

      // 4. OBS Scene Activate & Visibility Health Watcher
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
          if (!wsInstance || wsInstance.readyState !== WebSocket.OPEN) {
            connectLocalWs(wsUrl);
          }
          if (!mqttClient || !mqttClient.isConnected()) {
            connectMqtt();
          }
        }
      });

      // 5. Chequeo periódico de salud en segundo plano cada 15s
      setInterval(() => {
        const wsOpen = wsInstance && wsInstance.readyState === WebSocket.OPEN;
        const mqttOpen = mqttClient && mqttClient.isConnected();
        if (!wsOpen && !mqttOpen) {
          connectLocalWs(wsUrl);
          connectMqtt();
        }
      }, 15000);
    }

    connectChannels();
  </script>
</body>
</html>
