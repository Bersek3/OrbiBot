<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>OBS Chat Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Bebas+Neue&family=Chakra+Petch:wght@400;700&family=Cinzel:wght@700&family=Creepster&family=Fredoka:wght@500;700&family=Inter:wght@400;700&family=Luckiest+Guy&family=Montserrat:wght@500;700;900&family=Orbitron:wght@600;900&family=Outfit:wght@400;600;800&family=Permanent+Marker&family=Poppins:wght@400;600;800&family=Press+Start+2P&family=Righteous&family=Roboto:wght@400;700&family=Rubik:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/overlays.css">
  <script src="https://cdn.jsdelivr.net/npm/tmi.js@1.8.5/dist/tmi.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
</head>
<body>
  <div id="chatContainer" class="chat-container"></div>

  <script>
    const chatContainer = document.getElementById('chatContainer');
    const MAX_MESSAGES = 15;

    // Platform Configuration State
    let chatPlatformsConfig = { twitch: true, kick: true };
    let activeTwitchChannel = '';
    let activeKickChannel = '';

    // Load custom widget styles & platform settings from streamer config
    (async function loadConfigAndStyles() {
      try {
        const [styleRes, cfgRes] = await Promise.all([
          fetch('/api/widget-styles').then(r => r.json()).catch(() => ({})),
          fetch('/api/config').then(r => r.json()).catch(() => ({}))
        ]);

        if (styleRes && styleRes.chat) {
          if (styleRes.chat.finalCSS || styleRes.chat.generatedCSS) {
            const style = document.createElement('style');
            style.id = 'orbibot-custom-styles';
            style.textContent = styleRes.chat.finalCSS || styleRes.chat.generatedCSS;
            document.head.appendChild(style);
          }
          if (styleRes.chat.customJS) {
            const s = document.createElement('script');
            s.textContent = styleRes.chat.customJS;
            document.body.appendChild(s);
          }
        }

        if (cfgRes) {
          updatePlatformsState(cfgRes);
        }
      } catch(e) { /* Overlay running standalone */ }
    })();

    function updatePlatformsState(cfg) {
      if (!cfg) return;
      if (cfg.chatPlatforms) {
        chatPlatformsConfig = { ...chatPlatformsConfig, ...cfg.chatPlatforms };
      }
      if (cfg.twitch && cfg.twitch.channel) {
        activeTwitchChannel = (cfg.twitch.channel || '').toLowerCase().replace(/^#/, '');
      }
      if (cfg.kick && (cfg.kick.channel || cfg.kick.username)) {
        activeKickChannel = (cfg.kick.channel || cfg.kick.username || '').toLowerCase().replace(/^@/, '');
      }
    }

    // Check if BOTH platforms are enabled simultaneously
    function areBothPlatformsEnabled() {
      const urlParams = new URLSearchParams(window.location.search);
      const urlTwitch = (urlParams.get('channel') || activeTwitchChannel).trim();
      const urlKick = (urlParams.get('kick') || activeKickChannel).trim();

      const twitchActive = (chatPlatformsConfig.twitch !== false) && Boolean(urlTwitch);
      const kickActive = (chatPlatformsConfig.kick !== false) && Boolean(urlKick);
      return Boolean(twitchActive && kickActive);
    }

    function isPlatformAllowed(platform) {
      if (platform === 'kick') {
        return chatPlatformsConfig.kick !== false;
      }
      return chatPlatformsConfig.twitch !== false;
    }

    // Platform Logo Badge (Shown ONLY if BOTH Twitch and Kick are enabled)
    function getPlatformBadgeHtml(platform) {
      if (!areBothPlatformsEnabled()) {
        return ''; // Hide logo if only 1 platform is enabled
      }

      if (platform === 'kick') {
        return `
          <span class="platform-badge kick" title="Kick Chat" style="display: inline-flex; align-items: center; justify-content: center; width: 17px; height: 17px; background: #53fc18; border-radius: 4px; vertical-align: middle; margin-right: 5px; flex-shrink: 0; box-shadow: 0 0 6px rgba(83, 252, 24, 0.4);">
            <svg viewBox="0 0 32 32" width="11" height="11" fill="#000000">
              <path d="M4 2h8v8h3V6h3V2h10v10h-3v3h-3v2h3v3h3v10H18v-4h-3v-3h-3v-2H9v9H4V2z" />
            </svg>
          </span>
        `;
      }

      // Twitch logo badge
      return `
        <span class="platform-badge twitch" title="Twitch Chat" style="display: inline-flex; align-items: center; justify-content: center; width: 17px; height: 17px; background: #9146ff; border-radius: 4px; vertical-align: middle; margin-right: 5px; flex-shrink: 0; box-shadow: 0 0 6px rgba(145, 70, 255, 0.4);">
          <svg viewBox="0 0 24 24" width="11" height="11" fill="#ffffff">
            <path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z" />
          </svg>
        </span>
      `;
    }

    // ================= TWITCH BADGES & EMOTES =================
    const DEFAULT_TWITCH_BADGES = {
      broadcaster: {
        title: 'Streamer / Transmisor',
        url: 'https://static-cdn.jtvnw.net/badges/v1/5527c58c-fb7d-422d-b71b-f309dcb85cc1/1'
      },
      moderator: {
        title: 'Moderador',
        url: 'https://static-cdn.jtvnw.net/badges/v1/3267646d-33f0-4b17-b3df-f923a41db1d0/1'
      },
      vip: {
        title: 'VIP',
        url: 'https://static-cdn.jtvnw.net/badges/v1/b817aba4-fad8-49e2-b88a-7cc744dfa6ec/1'
      },
      subscriber: {
        title: 'Suscriptor',
        url: 'https://static-cdn.jtvnw.net/badges/v1/5d9f2208-5dd8-11e7-8513-2ff4adfae661/1'
      },
      founder: {
        title: 'Fundador',
        url: 'https://static-cdn.jtvnw.net/badges/v1/511b78a9-ab37-472f-9569-457753bbe7d3/1'
      },
      premium: {
        title: 'Prime Gaming',
        url: 'https://static-cdn.jtvnw.net/badges/v1/bbbe0db0-a598-423e-86d0-f9fb98ca1933/1'
      },
      turbo: {
        title: 'Turbo',
        url: 'https://static-cdn.jtvnw.net/badges/v1/bd444ec6-8f34-4bf9-91f4-af1e3428d80f/1'
      },
      partner: {
        title: 'Verificado',
        url: 'https://static-cdn.jtvnw.net/badges/v1/d12a2e27-16f6-41d0-ab77-b780518f00a3/1'
      },
      'artist-badge': {
        title: 'Artista',
        url: 'https://static-cdn.jtvnw.net/badges/v1/4300a897-03dc-4e83-8c0e-c332fee7057f/1'
      },
      'bot-badge': {
        title: 'Bot de Chat',
        url: 'https://static-cdn.jtvnw.net/badges/v1/3ffa9565-c35b-4cad-800b-041e60659cf2/1'
      }
    };

    const channelBadgesCache = {};
    const loadedBadgesChannels = new Set();

    async function loadChannelBadges(channelIdOrName) {
      if (!channelIdOrName || loadedBadgesChannels.has(channelIdOrName)) return;
      loadedBadgesChannels.add(channelIdOrName);
      try {
        const isId = /^\d+$/.test(channelIdOrName);
        const param = isId ? `id=${channelIdOrName}` : `name=${channelIdOrName.toLowerCase().replace(/^#/, '')}`;
        const res = await fetch(`https://api.ivr.fi/v2/twitch/badges/channel?${param}`);
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data)) {
            data.forEach(set => {
              if (!channelBadgesCache[set.set_id]) channelBadgesCache[set.set_id] = {};
              if (Array.isArray(set.versions)) {
                set.versions.forEach(v => {
                  channelBadgesCache[set.set_id][v.id] = {
                    title: v.title,
                    url: v.image_url_1x || v.image_url_2x || v.image_url_4x
                  };
                });
              }
            });
          }
        }
      } catch (e) {}
    }

    function getTwitchBadgeInfo(setId, version) {
      if (channelBadgesCache[setId] && channelBadgesCache[setId][version]) {
        return channelBadgesCache[setId][version];
      }
      if (DEFAULT_TWITCH_BADGES[setId]) {
        return DEFAULT_TWITCH_BADGES[setId];
      }
      return null;
    }

    function renderTwitchBadges(badgesData, isMod, isSub) {
      let badges = {};
      if (typeof badgesData === 'string') {
        badgesData.split(',').forEach(part => {
          const [k, v] = part.split('/');
          if (k) badges[k] = v || '1';
        });
      } else if (badgesData && typeof badgesData === 'object') {
        badges = badgesData;
      }

      let html = '';
      const badgeOrder = ['broadcaster', 'moderator', 'vip', 'founder', 'subscriber', 'artist-badge', 'partner', 'premium', 'turbo', 'bot-badge'];
      const processed = new Set();

      for (const key of badgeOrder) {
        if (badges[key] !== undefined) {
          processed.add(key);
          const info = getTwitchBadgeInfo(key, badges[key]);
          if (info) {
            html += `<img class="twitch-badge" src="${info.url}" alt="${escapeHtml(info.title)}" title="${escapeHtml(info.title)}" loading="lazy">`;
          }
        }
      }

      for (const key in badges) {
        if (!processed.has(key)) {
          const info = getTwitchBadgeInfo(key, badges[key]);
          if (info) {
            html += `<img class="twitch-badge" src="${info.url}" alt="${escapeHtml(info.title)}" title="${escapeHtml(info.title)}" loading="lazy">`;
          }
        }
      }

      if (!html) {
        if (isMod) {
          const m = DEFAULT_TWITCH_BADGES.moderator;
          html += `<img class="twitch-badge" src="${m.url}" alt="${m.title}" title="${m.title}" loading="lazy">`;
        } else if (isSub) {
          const s = DEFAULT_TWITCH_BADGES.subscriber;
          html += `<img class="twitch-badge" src="${s.url}" alt="${s.title}" title="${s.title}" loading="lazy">`;
        }
      }

      return html;
    }

    function renderKickBadges(badges) {
      if (!badges || !Array.isArray(badges) || badges.length === 0) return '';
      let html = '';
      badges.forEach(b => {
        const type = b.type || '';
        if (type === 'broadcaster') {
          html += `<span class="kick-badge" style="display:inline-block; padding:1px 5px; background:#53fc18; color:#000; font-size:10px; font-weight:800; border-radius:3px; margin-right:4px; vertical-align:middle; line-height:1.2;">HOST</span>`;
        } else if (type === 'moderator') {
          html += `<span class="kick-badge" style="display:inline-block; padding:1px 5px; background:#10b981; color:#fff; font-size:10px; font-weight:800; border-radius:3px; margin-right:4px; vertical-align:middle; line-height:1.2;">MOD</span>`;
        } else if (type === 'subscriber') {
          html += `<span class="kick-badge" style="display:inline-block; padding:1px 5px; background:#3b82f6; color:#fff; font-size:10px; font-weight:800; border-radius:3px; margin-right:4px; vertical-align:middle; line-height:1.2;">SUB</span>`;
        } else if (type === 'vip') {
          html += `<span class="kick-badge" style="display:inline-block; padding:1px 5px; background:#ec4899; color:#fff; font-size:10px; font-weight:800; border-radius:3px; margin-right:4px; vertical-align:middle; line-height:1.2;">VIP</span>`;
        }
      });
      return html;
    }

    function formatTwitchEmotes(message, emotes) {
      if (!message) return '';
      if (!emotes || typeof emotes !== 'object' || Object.keys(emotes).length === 0) {
        return escapeHtml(message);
      }
      const ranges = [];
      for (const emoteId in emotes) {
        const list = emotes[emoteId];
        if (Array.isArray(list)) {
          list.forEach(range => {
            const parts = range.split('-');
            const start = parseInt(parts[0], 10);
            const end = parseInt(parts[1], 10);
            if (!isNaN(start) && !isNaN(end)) {
              ranges.push({ id: emoteId, start, end });
            }
          });
        }
      }
      if (ranges.length === 0) {
        return escapeHtml(message);
      }
      ranges.sort((a, b) => a.start - b.start);

      let html = '';
      let lastIdx = 0;
      for (const r of ranges) {
        if (r.start > lastIdx) {
          html += escapeHtml(message.slice(lastIdx, r.start));
        }
        const emoteName = message.slice(r.start, r.end + 1);
        html += `<img class="twitch-emote" src="https://static-cdn.jtvnw.net/emoticons/v2/${r.id}/default/dark/1.0" alt="${escapeHtml(emoteName)}" title="${escapeHtml(emoteName)}" loading="lazy">`;
        lastIdx = r.end + 1;
      }
      if (lastIdx < message.length) {
        html += escapeHtml(message.slice(lastIdx));
      }
      return html;
    }

    function addMessage(data) {
      if (!data || !data.message) return;
      const platform = data.platform || 'twitch';

      // Check if platform is enabled
      if (!isPlatformAllowed(platform)) {
        return;
      }

      if (data.roomId && platform === 'twitch') {
        loadChannelBadges(data.roomId);
      }

      const bubble = document.createElement('div');
      bubble.className = `chat-bubble chat-platform-${platform}`;

      if (platform === 'kick') {
        bubble.style.borderLeftColor = '#53fc18';
      } else if (data.isMod || (data.badges && data.badges.broadcaster)) {
        bubble.style.borderLeftColor = '#00f2fe';
      }

      const platformBadge = getPlatformBadgeHtml(platform);
      const badgeHtml = platform === 'kick' ? renderKickBadges(data.badges) : renderTwitchBadges(data.badges || data.badgesRaw, data.isMod, data.isSub);
      const formattedText = platform === 'twitch' ? formatTwitchEmotes(data.message, data.emotes) : escapeHtml(data.message);
      const userColor = data.color || (platform === 'kick' ? '#53fc18' : '#9146ff');

      bubble.innerHTML = `
        <div>
          ${platformBadge}
          <span class="chat-badges">${badgeHtml}</span>
          <span class="username" style="color: ${userColor}">${escapeHtml(data.user)}:</span>
          <span class="text">${formattedText}</span>
        </div>
      `;

      chatContainer.appendChild(bubble);

      while (chatContainer.children.length > MAX_MESSAGES) {
        chatContainer.removeChild(chatContainer.firstChild);
      }

      setTimeout(() => {
        bubble.style.transition = 'opacity 0.8s ease, transform 0.8s ease';
        bubble.style.opacity = '0';
        bubble.style.transform = 'translateY(-10px)';
        setTimeout(() => {
          if (bubble.parentNode) bubble.parentNode.removeChild(bubble);
        }, 800);
      }, 20000);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function handleIncomingMessage(msg) {
      if (!msg) return;
      if (msg.event === 'chat_message') {
        addMessage(msg.data);
      } else if (msg.event === 'config_updated' && msg.data) {
        updatePlatformsState(msg.data);
      } else if (msg.event === 'chat_platform_toggle' && msg.data) {
        chatPlatformsConfig = { ...chatPlatformsConfig, ...msg.data };
      }
    }

    function connectChannels() {
      const urlParams = new URLSearchParams(window.location.search);
      const channel = (urlParams.get('channel') || '').toLowerCase().replace(/^#/, '');
      const kickChannel = (urlParams.get('kick') || '').toLowerCase().replace(/^@/, '');
      const token = (urlParams.get('token') || urlParams.get('key') || '').trim();

      if (channel) {
        activeTwitchChannel = channel;
        loadChannelBadges(channel);
      }
      if (kickChannel) {
        activeKickChannel = kickChannel;
      }

      // 1. Direct Twitch IRC
      if (channel && window.tmi) {
        try {
          const tmiClient = new window.tmi.Client({
            connection: { reconnect: true, secure: true },
            channels: [channel]
          });
          tmiClient.connect().catch(console.error);

          tmiClient.on('message', (ch, tags, message, self) => {
            if (self) return;
            const username = tags['display-name'] || tags.username;
            const isMod = tags.mod || tags.badges?.broadcaster === '1';
            const isSub = tags.subscriber || tags.badges?.subscriber !== undefined;
            const userColor = tags.color || '#9146ff';

            addMessage({
              id: tags.id || Date.now().toString(),
              platform: 'twitch',
              user: username,
              color: userColor,
              message,
              isMod,
              isSub,
              badges: tags.badges || {},
              badgesRaw: tags['badges-raw'] || null,
              emotes: tags.emotes || null,
              roomId: tags['room-id'] || null
            });
          });
        } catch(e) {}
      }

      // 2. Direct Kick Pusher WebSocket
      if (kickChannel) {
        connectKickChatDirect(kickChannel);
      }

      // 3. Local WebSocket Server Connection
      let wsInstance = null;
      let wsReconnectTimeout = null;

      function connectLocalWs(url) {
        if (wsReconnectTimeout) clearTimeout(wsReconnectTimeout);
        try {
          wsInstance = new WebSocket(url);
          wsInstance.onmessage = (event) => {
            try { handleIncomingMessage(JSON.parse(event.data)); } catch(e) {}
          };
          wsInstance.onerror = () => scheduleWsReconnect(url);
          wsInstance.onclose = () => scheduleWsReconnect(url);
        } catch(e) {
          scheduleWsReconnect(url);
        }
      }

      function scheduleWsReconnect(url) {
        if (wsReconnectTimeout) clearTimeout(wsReconnectTimeout);
        wsReconnectTimeout = setTimeout(() => {
          connectLocalWs(url);
        }, 3000);
      }

      const isGitHubPages = location.hostname.endsWith('github.io');
      const wsUrl = !isGitHubPages
        ? `${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}`
        : 'ws://localhost:3000';

      connectLocalWs(wsUrl);

      // 4. Cloud Real-time Relay (Paho MQTT)
      let mqttClient = null;
      let mqttReconnectTimeout = null;

      function connectMqtt() {
        if (typeof Paho !== 'undefined') {
          if (mqttReconnectTimeout) clearTimeout(mqttReconnectTimeout);

          const targetChan = channel || kickChannel;
          if (!targetChan) return;
          const clientId = 'orbi_chat_' + Math.random().toString(36).substring(2, 9);
          try {
            mqttClient = new Paho.MQTT.Client('broker.emqx.io', 8084, clientId);
            mqttClient.onConnectionLost = (responseObject) => {
              scheduleMqttReconnect();
            };
            mqttClient.onMessageArrived = (message) => {
              try {
                const payload = JSON.parse(message.payloadString);
                handleIncomingMessage(payload);
              } catch(e) {}
            };
            mqttClient.connect({
              useSSL: true,
              timeout: 6,
              keepAliveInterval: 30,
              onSuccess: () => {
                if (token) {
                  mqttClient.subscribe(`orbibot/${targetChan}_${token}/events`);
                }
                mqttClient.subscribe(`orbibot/${targetChan}/events`);
              },
              onFailure: () => {
                scheduleMqttReconnect();
              }
            });
          } catch(e) {
            scheduleMqttReconnect();
          }
        }
      }

      function scheduleMqttReconnect() {
        if (mqttReconnectTimeout) clearTimeout(mqttReconnectTimeout);
        mqttReconnectTimeout = setTimeout(connectMqtt, 3500);
      }

      connectMqtt();

      // 5. BroadcastChannel & Storage for same-browser testing
      if (typeof BroadcastChannel !== 'undefined') {
        const bc = new BroadcastChannel('orbibot_stream_channel');
        bc.onmessage = (e) => handleIncomingMessage(e.data);
      }

      window.addEventListener('storage', (e) => {
        if (e.key === 'orbibot_last_event' && e.newValue) {
          try { handleIncomingMessage(JSON.parse(e.newValue)); } catch (err) {}
        }
      });
    }

    function connectKickChatDirect(kickChannel) {
      const clean = kickChannel.toLowerCase().replace(/^@/, '').trim();
      const pusherUrl = 'wss://ws-us2.pusher.com/app/eb1d5f283081ab659038?protocol=7&client=js&version=7.6.0&flash=false';

      async function startKickWs() {
        let chatroomId = null;
        try {
          const res = await fetch(`/api/kick/chatroom/${clean}`);
          if (res.ok) {
            const d = await res.json();
            chatroomId = d.chatroomId;
          }
        } catch(e) {}

        const targetRoom = chatroomId || clean;
        try {
          const kws = new WebSocket(pusherUrl);
          kws.onopen = () => {
            kws.send(JSON.stringify({
              event: 'pusher:subscribe',
              data: { auth: '', channel: `chatrooms.${targetRoom}.v2` }
            }));
            setInterval(() => {
              if (kws.readyState === WebSocket.OPEN) {
                kws.send(JSON.stringify({ event: 'pusher:ping', data: {} }));
              }
            }, 20000);
          };
          kws.onmessage = (ev) => {
            try {
              const pkt = JSON.parse(ev.data);
              if (pkt.event === 'App\\Events\\ChatMessageEvent' || pkt.event === 'ChatMessageEvent') {
                const msgData = typeof pkt.data === 'string' ? JSON.parse(pkt.data) : pkt.data;
                const sender = msgData.sender || {};
                const badges = sender.identity?.badges || [];
                addMessage({
                  id: msgData.id || `kick-${Date.now()}`,
                  platform: 'kick',
                  user: sender.username || sender.slug || 'KickUser',
                  color: sender.identity?.color || '#53fc18',
                  message: msgData.content || '',
                  isMod: badges.some(b => b.type === 'moderator' || b.type === 'broadcaster'),
                  isSub: badges.some(b => b.type === 'subscriber'),
                  badges,
                  emotes: null
                });
              }
            } catch(e) {}
          };
          kws.onclose = () => {
            setTimeout(startKickWs, 6000);
          };
        } catch(e) {}
      }
      startKickWs();
    }

    connectChannels();
  </script>
</body>
</html>
