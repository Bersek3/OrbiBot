<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>OBS Alert Box Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Bebas+Neue&family=Chakra+Petch:wght@400;700&family=Cinzel:wght@700&family=Creepster&family=Fredoka:wght@500;700&family=Inter:wght@400;700&family=Luckiest+Guy&family=Montserrat:wght@500;700;900&family=Orbitron:wght@600;900&family=Outfit:wght@400;600;800&family=Permanent+Marker&family=Poppins:wght@400;600;800&family=Press+Start+2P&family=Righteous&family=Roboto:wght@400;700&family=Rubik:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/overlays.css">
  <!-- TMI.js for direct Twitch events (Subs, Bits, Raids) -->
  <script src="https://cdn.jsdelivr.net/npm/tmi.js@1.8.5/dist/tmi.min.js"></script>
  <!-- Paho MQTT for real-time cloud relay between Dashboard and OBS Studio -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
</head>
<body>
  <!-- Temporary status badge on OBS load to confirm active connection -->
  <div id="statusBadge" style="position: fixed; bottom: 12px; right: 12px; background: rgba(10, 13, 20, 0.85); border: 1px solid rgba(0, 242, 254, 0.4); color: #00f2fe; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-family: sans-serif; pointer-events: none; transition: opacity 0.8s ease; opacity: 1; z-index: 99999; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
    ⚡ Conectando OrbiBot Alert Box...
  </div>

  <div class="alert-container">
    <div id="alertCard" class="alert-card">
      <div id="alertBadge" class="alert-badge">NUEVO EVENTO</div>
      <div class="alert-media-wrap">
        <img id="alertImage" class="alert-media" src="" alt="Alert GIF">
      </div>
      <div id="alertTitle" class="alert-title">¡Nuevo Seguidor!</div>
      <div id="alertMessage" class="alert-message">Usuario se ha suscrito</div>
    </div>
  </div>

  <script>
    // Load custom widget styles from streamer config
    (async function loadCustomStyles() {
      try {
        const res = await fetch('/api/widget-styles');
        const data = await res.json();
        if (data.alerts) {
          if (data.alerts.images) {
            Object.keys(data.alerts.images).forEach(k => {
              if (!alertsConfig[k]) alertsConfig[k] = {};
              alertsConfig[k].image = data.alerts.images[k];
            });
          }
          if (data.alerts.finalCSS || data.alerts.generatedCSS) {
            const style = document.createElement('style');
            style.id = 'orbibot-custom-styles';
            style.textContent = data.alerts.finalCSS || data.alerts.generatedCSS;
            document.head.appendChild(style);
          }
          if (data.alerts.customJS) {
            const script = document.createElement('script');
            script.textContent = data.alerts.customJS;
            document.body.appendChild(script);
          }
        }
      } catch(e) { /* Overlay running without backend */ }
    })();

    function showStatusBadge(text, duration = 4000) {
      const badge = document.getElementById('statusBadge');
      if (!badge) return;
      badge.innerText = text;
      badge.style.opacity = '1';
      setTimeout(() => {
        badge.style.opacity = '0';
      }, duration);
    }

    // Audio synthesizer for alerts using Web Audio API
    function playChime(type) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const now = audioCtx.currentTime;

        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        osc1.type = 'triangle';
        osc2.type = 'sine';

        let freqs = [523.25, 659.25, 783.99, 1046.50];
        if (type === 'bits') freqs = [587.33, 739.99, 880.00, 1174.66];
        if (type === 'sub') freqs = [440.00, 554.37, 659.25, 880.00];
        if (type === 'raid') freqs = [493.88, 659.25, 987.77, 1318.51];

        osc1.frequency.setValueAtTime(freqs[0], now);
        osc1.frequency.exponentialRampToValueAtTime(freqs[1], now + 0.12);
        osc1.frequency.exponentialRampToValueAtTime(freqs[2], now + 0.24);
        osc1.frequency.exponentialRampToValueAtTime(freqs[3], now + 0.36);

        osc2.frequency.setValueAtTime(freqs[1] / 2, now);
        osc2.frequency.exponentialRampToValueAtTime(freqs[3] / 2, now + 0.4);

        gainNode.gain.setValueAtTime(0.01, now);
        gainNode.gain.linearRampToValueAtTime(0.3, now + 0.05);
        gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);

        osc1.connect(gainNode);
        osc2.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + 1.2);
        osc2.stop(now + 1.2);
      } catch (e) {
        console.warn('Audio Context error:', e);
      }
    }

    const alertCard = document.getElementById('alertCard');
    const alertBadge = document.getElementById('alertBadge');
    const alertImage = document.getElementById('alertImage');
    const alertTitle = document.getElementById('alertTitle');
    const alertMessage = document.getElementById('alertMessage');

    let alertQueue = [];
    let isShowingAlert = false;
    let alertsConfig = {
      follower: { enabled: true, title: '¡Nuevo Seguidor!', message: '{user} ahora sigue el canal', duration: 5, image: 'https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExdWk1YW0yZXpxM3c2NHJreGQxbDduMWVvb3hpZGl2dHVqMm1pMG1jYyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/artj92V8o75VPL7AeQ/giphy.gif' },
      sub: { enabled: true, title: '¡Nueva Suscripción!', message: '¡{user} se ha suscrito al canal!', duration: 6, image: 'https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHF4bWpna2JpcXpiZWhqZXE1aXF3MHp4eGpoMXE1bmRhNDVvNXppZSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/IwAZ6dvvvaNN6/giphy.gif' },
      bits: { enabled: true, title: '¡Donación de Bits!', message: '{user} envió {amount} bits {message}', duration: 6, image: 'https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExeGJ3eG5obHRwZjcxNHNlNW56dzd2dXB1NmJhcWlnM3c5enIydTFoYSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/LdOyjZ7io5MFUvcKs2/giphy.gif' },
      raid: { enabled: true, title: '¡Raid Entrante!', message: '¡{user} ha llegado con {viewers} espectadores!', duration: 6, image: 'https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExd2Z0dTh1Z3E0cW51ZnRtdnExNmRwbTN4eWxnd2ZtN213MWg5bmk0eCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/blSTtZehjAZ8I/giphy.gif' },
      channel_points: { enabled: true, title: '¡Recompensa Canjeada!', message: '{user} canjeó {reward}', duration: 5, image: 'https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOW11aWRqZG56YWNka2R3N3N6M2cydDV0OW15bmw0NWJ1ZW51bnd4eiZlcD12MV9naWZzX3NlYXJjaCZjdD1n/111ebonMs90YLu/giphy.gif' }
    };

    // Load configs from server if available
    fetch('/api/alerts')
      .then(r => r.json())
      .then(data => { if (data && typeof data === 'object') alertsConfig = { ...alertsConfig, ...data }; })
      .catch(() => {});

    function processQueue() {
      if (isShowingAlert || alertQueue.length === 0) return;
      isShowingAlert = true;

      const current = alertQueue.shift();
      showAlert(current);
    }

    function showAlert(alertData) {
      const type = alertData.type || 'follower';
      const cfg = (alertsConfig && alertsConfig[type]) ? alertsConfig[type] : {};

      if (cfg.enabled === false) {
        isShowingAlert = false;
        processQueue();
        return;
      }

      let titleText = cfg.title || '¡Nuevo Evento!';
      let messageTemplate = cfg.message || '{user} ha participado';

      const user = alertData.user || 'Alguien';
      const amount = alertData.amount || 0;
      const viewers = alertData.viewers || 0;
      const tier = alertData.tier || '1';
      const reward = alertData.reward || '';
      const customMsg = alertData.message ? `"${alertData.message}"` : '';

      let formattedMessage = messageTemplate
        .replace(/{user}/g, `<span class="alert-username">${user}</span>`)
        .replace(/{amount}/g, amount)
        .replace(/{viewers}/g, viewers)
        .replace(/{tier}/g, tier)
        .replace(/{reward}/g, reward)
        .replace(/{message}/g, customMsg);

      if (type === 'sound') {
        titleText = `¡Efecto de Sonido!`;
        formattedMessage = `<span class="alert-username">${user}</span> activó <strong>${reward || 'Sonido Personalizado'}</strong>`;
      }

      alertBadge.innerText = type.toUpperCase().replace('_', ' ');
      alertTitle.innerHTML = titleText;
      alertMessage.innerHTML = formattedMessage;

      const mediaUrl = cfg.image || 'https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExdWk1YW0yZXpxM3c2NHJreGQxbDduMWVvb3hpZGl2dHVqMm1pMG1jYyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/artj92V8o75VPL7AeQ/giphy.gif';
      alertImage.src = mediaUrl;

      // Play Sound (Soporta URLs absolutas y rutas relativas /assets/sounds/...)
      const soundToPlay = alertData.soundUrl || cfg.sound;
      if (soundToPlay) {
        try {
          const audio = new Audio(soundToPlay);
          audio.play().catch(() => playChime(type));
        } catch(e) {
          playChime(type);
        }
      } else {
        playChime(type);
      }

      // Show Card
      alertCard.classList.add('active');

      const durationSec = (cfg.duration || 6) * 1000;
      setTimeout(() => {
        alertCard.classList.remove('active');
        setTimeout(() => {
          isShowingAlert = false;
          processQueue();
        }, 600);
      }, durationSec);
    }

    function handleIncomingMessage(msg) {
      if (!msg) return;
      if (msg.event === 'alert') {
        alertQueue.push(msg.data);
        processQueue();
      } else if (msg.event === 'alerts_updated') {
        alertsConfig = { ...alertsConfig, ...msg.data };
      }
    }

    // ================= MULTI-CHANNEL CONNECTION =================
    function connectChannels() {
      const urlParams = new URLSearchParams(window.location.search);
      const channel = (urlParams.get('channel') || '').toLowerCase().replace(/^#/, '');
      const token = (urlParams.get('token') || urlParams.get('key') || '').trim();

      // Check if test alert requested via URL (e.g. ?test=1)
      if (urlParams.get('test') === '1') {
        setTimeout(() => {
          showAlert({ type: 'follower', user: 'StreamerTest' });
        }, 1500);
      }

      // 1. Try Local Server WebSocket with Auto-Reconnect loop
      let wsInstance = null;
      let wsReconnectTimeout = null;

      function connectLocalWs(url) {
        if (wsReconnectTimeout) clearTimeout(wsReconnectTimeout);
        try {
          if (wsInstance && (wsInstance.readyState === WebSocket.OPEN || wsInstance.readyState === WebSocket.CONNECTING)) {
            wsInstance.close();
          }
        } catch(e) {}

        try {
          wsInstance = new WebSocket(url);
          wsInstance.onopen = () => {
            showStatusBadge('🟢 Conectado a Servidor Local (WebSocket)', 3500);
          };
          wsInstance.onmessage = (event) => {
            try { handleIncomingMessage(JSON.parse(event.data)); } catch(e) {}
          };
          wsInstance.onerror = () => {
            scheduleWsReconnect(url);
          };
          wsInstance.onclose = () => {
            scheduleWsReconnect(url);
          };
        } catch(e) {
          scheduleWsReconnect(url);
        }
      }

      function scheduleWsReconnect(url) {
        if (wsReconnectTimeout) clearTimeout(wsReconnectTimeout);
        wsReconnectTimeout = setTimeout(() => {
          connectLocalWs(url);
        }, 3000);
      }

      const isGitHubPages = location.hostname.endsWith('github.io');
      const wsUrl = !isGitHubPages
        ? `${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}`
        : 'ws://localhost:3000';

      connectLocalWs(wsUrl);

      // 2. BroadcastChannel & Storage for same-browser testing
      if (typeof BroadcastChannel !== 'undefined') {
        const bc = new BroadcastChannel('orbibot_stream_channel');
        bc.onmessage = (e) => handleIncomingMessage(e.data);
      }

      window.addEventListener('storage', (e) => {
        if (e.key === 'orbibot_last_event' && e.newValue) {
          try { handleIncomingMessage(JSON.parse(e.newValue)); } catch (err) {}
        }
      });

      // 3. Connect to Twitch IRC directly via TMI.js (for Live Twitch Bits, Subs, Raids in OBS)
      if (channel && window.tmi) {
        try {
          const tmiClient = new window.tmi.Client({
            connection: { reconnect: true, secure: true, maxReconnectAttempts: Infinity, reconnectInterval: 3000 },
            channels: [channel]
          });
          tmiClient.connect().then(() => {
            showStatusBadge(`🟢 Conectado a Twitch (#${channel})`, 4500);
          }).catch(console.error);

          tmiClient.on('cheer', (userstate, message) => {
            const bits = parseInt(userstate.bits, 10) || 1;
            const username = userstate['display-name'] || userstate.username;
            showAlert({ type: 'bits', user: username, amount: bits, message });
          });

          tmiClient.on('subscription', (ch, username, method, message, userstate) => {
            const dName = userstate ? (userstate['display-name'] || username) : username;
            showAlert({ type: 'sub', user: dName, tier: method.plan, message });
          });

          tmiClient.on('resub', (ch, username, months, message, userstate, methods) => {
            const dName = userstate ? (userstate['display-name'] || username) : username;
            showAlert({ type: 'sub', user: dName, amount: months, message });
          });

          tmiClient.on('subgift', (ch, username, streakMonths, recipient, methods, userstate) => {
            const dName = userstate ? (userstate['display-name'] || username) : username;
            showAlert({ type: 'sub', user: dName, reward: `Regaló sub a ${recipient}` });
          });

          tmiClient.on('raided', (ch, username, viewers) => {
            showAlert({ type: 'raid', user: username, viewers: parseInt(viewers, 10) || 1 });
          });
        } catch(e) {
          console.error('TMI Client error:', e);
        }
      }

      // 4. Cloud Real-time Relay (Paho MQTT) with Auto-Reconnect loop
      let mqttClient = null;
      let mqttReconnectTimeout = null;

      function connectMqtt() {
        if (typeof Paho === 'undefined') return;
        if (mqttReconnectTimeout) clearTimeout(mqttReconnectTimeout);

        const relayChannel = channel || 'general';
        const clientId = 'orbi_obs_' + Math.random().toString(36).substring(2, 9);
        try {
          mqttClient = new Paho.MQTT.Client('broker.emqx.io', 8084, clientId);
          mqttClient.onConnectionLost = (responseObject) => {
            console.warn('MQTT Connection lost, reconnecting in 3.5s...', responseObject);
            scheduleMqttReconnect();
          };
          mqttClient.onMessageArrived = (message) => {
            try {
              const payload = JSON.parse(message.payloadString);
              handleIncomingMessage(payload);
            } catch(err) {}
          };
          mqttClient.connect({
            useSSL: true,
            timeout: 6,
            keepAliveInterval: 30,
            onSuccess: () => {
              if (token && relayChannel !== 'general') {
                mqttClient.subscribe(`orbibot/${relayChannel}_${token}/events`);
              }
              mqttClient.subscribe(`orbibot/${relayChannel}/events`);
              showStatusBadge(`🟢 OrbiBot Listo en OBS (#${relayChannel})`, 4000);
            },
            onFailure: (e) => {
              console.warn('MQTT connect failed, retrying in 4s...', e);
              scheduleMqttReconnect();
            }
          });
        } catch(e) {
          scheduleMqttReconnect();
        }
      }

      function scheduleMqttReconnect() {
        if (mqttReconnectTimeout) clearTimeout(mqttReconnectTimeout);
        mqttReconnectTimeout = setTimeout(connectMqtt, 3500);
      }

      connectMqtt();

      // 5. OBS Scene Activate & Visibility Health Watcher
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
          if (!wsInstance || wsInstance.readyState !== WebSocket.OPEN) {
            connectLocalWs(wsUrl);
          }
          if (!mqttClient || !mqttClient.isConnected()) {
            connectMqtt();
          }
        }
      });

      // Chequeo periódico de salud en segundo plano cada 15s
      setInterval(() => {
        const wsOpen = wsInstance && wsInstance.readyState === WebSocket.OPEN;
        const mqttOpen = mqttClient && mqttClient.isConnected();
        if (!wsOpen && !mqttOpen) {
          connectLocalWs(wsUrl);
          connectMqtt();
        }
      }, 15000);
    }

    connectChannels();
  </script>
</body>
</html>
