<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>OBS Goal Widget Overlay - OrbiBot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Bebas+Neue&family=Chakra+Petch:wght@400;700&family=Cinzel:wght@700&family=Creepster&family=Fredoka:wght@500;700&family=Inter:wght@400;700&family=Luckiest+Guy&family=Montserrat:wght@500;700;900&family=Orbitron:wght@600;900&family=Outfit:wght@400;600;800&family=Permanent+Marker&family=Poppins:wght@400;600;800&family=Press+Start+2P&family=Righteous&family=Roboto:wght@400;700&family=Rubik:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/overlays.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  <style>
    .goal-card {
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .goal-bar-fill {
      transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.4s ease;
    }
  </style>
</head>
<body>
  <div class="goal-container" id="goalContainer">
    <div class="goal-card" id="goalCard">
      <div class="goal-header">
        <span id="goalTitle" class="goal-title">Cargando Meta...</span>
        <span class="goal-numbers">
          <span id="goalCurrent">0</span> / <span id="goalTarget">100</span>
        </span>
      </div>
      <div class="goal-bar-bg">
        <div id="goalFill" class="goal-bar-fill"></div>
      </div>
      <div class="goal-footer">
        <span id="goalPercent" class="goal-percent">0%</span>
      </div>
    </div>
  </div>

  <script>
    // Load custom widget styles from streamer config
    (async function loadCustomStyles() {
      try {
        const res = await fetch('/api/widget-styles');
        const data = await res.json();
        if (data.goals) {
          if (data.goals.finalCSS || data.goals.generatedCSS) {
            const style = document.createElement('style');
            style.id = 'orbibot-custom-styles';
            style.textContent = data.alerts?.finalCSS || data.goals.finalCSS || data.goals.generatedCSS;
            document.head.appendChild(style);
          }
          if (data.goals.customJS) {
            const s = document.createElement('script');
            s.textContent = data.goals.customJS;
            document.body.appendChild(s);
          }
        }
      } catch(e) { /* Overlay running without backend */ }
    })();

    const urlParams = new URLSearchParams(window.location.search);
    const requestedGoalId = (urlParams.get('goalId') || urlParams.get('id') || urlParams.get('type') || '').trim();
    const channel = (urlParams.get('channel') || '').toLowerCase().replace(/^#/, '');
    const token = (urlParams.get('token') || urlParams.get('key') || '').trim();

    const goalContainer = document.getElementById('goalContainer');
    const goalTitle = document.getElementById('goalTitle');
    const goalCurrent = document.getElementById('goalCurrent');
    const goalTarget = document.getElementById('goalTarget');
    const goalFill = document.getElementById('goalFill');
    const goalPercent = document.getElementById('goalPercent');

    let activeGoal = null;

    function updateGoalDisplay(goal) {
      if (!goal) return;
      activeGoal = goal;

      if (goal.enabled === false) {
        goalContainer.style.opacity = '0';
        return;
      }
      goalContainer.style.opacity = '1';

      goalTitle.innerText = goal.title || 'Meta del Stream';
      goalCurrent.innerText = Number(goal.current) || 0;
      goalTarget.innerText = Number(goal.target) || 100;

      const current = Number(goal.current) || 0;
      const target = Number(goal.target) || 1;
      const pct = Math.min(100, Math.max(0, Math.round((current / target) * 100)));

      goalFill.style.width = `${pct}%`;
      goalPercent.innerText = `${pct}%`;

      const color1 = goal.color || '#9146ff';
      const color2 = goal.color2 || '#00f2fe';
      goalFill.style.background = `linear-gradient(90deg, ${color1}, ${color2})`;
      goalFill.style.boxShadow = `0 0 15px ${color1}80`;
    }

    function findMatchingGoal(goals) {
      if (!Array.isArray(goals) || goals.length === 0) return null;
      if (!requestedGoalId) return goals[0];

      const match = goals.find(g =>
        g.id === requestedGoalId ||
        g.id === 'goal_' + requestedGoalId ||
        (g.type && g.type.toLowerCase() === requestedGoalId.toLowerCase())
      );
      return match || goals[0];
    }

    // 1. Initial Load from LocalStorage
    try {
      const savedGoals = localStorage.getItem('orbibot_goals');
      if (savedGoals) {
        const parsed = JSON.parse(savedGoals);
        if (Array.isArray(parsed)) {
          const matched = findMatchingGoal(parsed);
          if (matched) updateGoalDisplay(matched);
        } else if (typeof parsed === 'object') {
          // Legacy object format
          if (parsed[requestedGoalId]) updateGoalDisplay(parsed[requestedGoalId]);
        }
      }
    } catch(e) {}

    // 2. Fetch from backend API
    async function loadGoalsFromApi() {
      try {
        const res = await fetch('/api/goals');
        if (res.ok) {
          const goals = await res.json();
          if (Array.isArray(goals) && goals.length > 0) {
            const matched = findMatchingGoal(goals);
            if (matched) updateGoalDisplay(matched);
            return;
          }
        }
      } catch(e) {}

      // Fallback fetch config
      try {
        const cfgRes = await fetch('/api/config');
        if (cfgRes.ok) {
          const cfg = await cfgRes.json();
          if (Array.isArray(cfg.goals)) {
            const matched = findMatchingGoal(cfg.goals);
            if (matched) updateGoalDisplay(matched);
          } else if (cfg.goals && requestedGoalId && cfg.goals[requestedGoalId]) {
            updateGoalDisplay(cfg.goals[requestedGoalId]);
          }
        }
      } catch(e) {}
    }

    loadGoalsFromApi();

    function handleIncomingMessage(msg) {
      if (!msg) return;
      const data = msg.data || msg;

      if (msg.event === 'goal_update' || data.goal) {
        const targetGoal = data.goal || data;
        const targetGoalId = data.goalId || targetGoal.id;
        if (!activeGoal || (targetGoalId && activeGoal.id === targetGoalId) || (data.type && activeGoal.type === data.type)) {
          updateGoalDisplay(targetGoal);
        }
      } else if (msg.event === 'goals_updated' && Array.isArray(data)) {
        const matched = findMatchingGoal(data);
        if (matched) updateGoalDisplay(matched);
      } else if (msg.event === 'alert') {
        if (!activeGoal) return;
        const alertType = data.type || '';
        let shouldIncrement = false;
        let incrementAmount = 1;

        if (alertType === 'sub' && (activeGoal.type === 'subs' || activeGoal.type === 'sub')) {
          shouldIncrement = true;
        } else if (alertType === 'follower' && (activeGoal.type === 'followers' || activeGoal.type === 'follower')) {
          shouldIncrement = true;
        } else if (alertType === 'bits' && (activeGoal.type === 'bits' || activeGoal.type === 'bit')) {
          shouldIncrement = true;
          incrementAmount = Number(data.amount) || 1;
        }

        if (shouldIncrement) {
          const newCurrent = (Number(activeGoal.current) || 0) + incrementAmount;
          activeGoal.current = newCurrent;
          updateGoalDisplay(activeGoal);
        }
      }
    }

    function connectChannels() {
      let wsInstance = null;
      let wsReconnectTimeout = null;

      function connectLocalWs(url) {
        if (wsReconnectTimeout) clearTimeout(wsReconnectTimeout);
        try {
          wsInstance = new WebSocket(url);
          wsInstance.onopen = () => {
            const targetRoom = channel || token;
            if (targetRoom) {
              wsInstance.send(JSON.stringify({ action: 'join', room: targetRoom }));
            }
          };
          wsInstance.onmessage = (event) => {
            try { handleIncomingMessage(JSON.parse(event.data)); } catch(e) {}
          };
          wsInstance.onerror = () => scheduleWsReconnect(url);
          wsInstance.onclose = () => scheduleWsReconnect(url);
        } catch(e) {
          scheduleWsReconnect(url);
        }
      }

      function scheduleWsReconnect(url) {
        if (wsReconnectTimeout) clearTimeout(wsReconnectTimeout);
        wsReconnectTimeout = setTimeout(() => {
          connectLocalWs(url);
        }, 3000);
      }

      const isGitHubPages = location.hostname.endsWith('github.io');
      const wsUrl = !isGitHubPages
        ? `${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}`
        : 'ws://localhost:3000';

      connectLocalWs(wsUrl);

      // Cloud Real-time Relay (Paho MQTT)
      let mqttClient = null;
      let mqttReconnectTimeout = null;

      function connectMqtt() {
        if (typeof Paho !== 'undefined') {
          if (mqttReconnectTimeout) clearTimeout(mqttReconnectTimeout);

          if (!channel) return;
          const clientId = 'orbi_goal_' + Math.random().toString(36).substring(2, 9);
          try {
            mqttClient = new Paho.MQTT.Client('broker.emqx.io', 8084, clientId);
            mqttClient.onConnectionLost = () => scheduleMqttReconnect();
            mqttClient.onMessageArrived = (message) => {
              try {
                handleIncomingMessage(JSON.parse(message.payloadString));
              } catch(e) {}
            };
            mqttClient.connect({
              useSSL: true,
              timeout: 6,
              keepAliveInterval: 30,
              onSuccess: () => {
                if (token) {
                  mqttClient.subscribe(`orbibot/${channel}_${token}/events`);
                } else {
                  mqttClient.subscribe(`orbibot/${channel}/events`);
                }
              },
              onFailure: () => scheduleMqttReconnect()
            });
          } catch(e) {
            scheduleMqttReconnect();
          }
        }
      }

      function scheduleMqttReconnect() {
        if (mqttReconnectTimeout) clearTimeout(mqttReconnectTimeout);
        mqttReconnectTimeout = setTimeout(connectMqtt, 3500);
      }

      connectMqtt();

      if (typeof BroadcastChannel !== 'undefined') {
        const bc = new BroadcastChannel('orbibot_stream_channel');
        bc.onmessage = (e) => handleIncomingMessage(e.data);
      }

      window.addEventListener('storage', (e) => {
        if (e.key === 'orbibot_last_event' && e.newValue) {
          try { handleIncomingMessage(JSON.parse(e.newValue)); } catch (err) {}
        }
      });

      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
          if (!wsInstance || wsInstance.readyState !== WebSocket.OPEN) connectLocalWs(wsUrl);
          if (!mqttClient || !mqttClient.isConnected()) connectMqtt();
        }
      });
    }

    connectChannels();
  </script>
</body>
</html>
