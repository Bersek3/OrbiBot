<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Song Request Audio Player - OBS Overlay | OrbyxBot</title>
  <!-- Paho MQTT client para sincronización en la nube -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: transparent;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #fff;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* En OBS la fuente puede configurarse a 1x1 invisible, o a 320x100 para ver el estado */
    .player-card {
      background: rgba(13, 17, 23, 0.95);
      border: 1px solid rgba(145, 70, 255, 0.4);
      border-radius: 12px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(145, 70, 255, 0.2);
      max-width: 420px;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    .thumb-box {
      width: 54px;
      height: 54px;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
      background: #1f1f2e;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .song-info {
      flex: 1;
      min-width: 0;
    }

    .status-badge {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #00f2fe;
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 2px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: #00ff88;
      border-radius: 50%;
      box-shadow: 0 0 8px #00ff88;
    }

    .song-title {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #fff;
    }

    .song-requester {
      font-size: 11px;
      color: #adadb8;
      margin-top: 2px;
    }

    .obs-hint {
      font-size: 10px;
      color: #9146ff;
      margin-top: 4px;
    }

    /* Reproductor embebido de YouTube: visible para Chromium/OBS pero sutil en pantalla */
    #ytContainer {
      position: absolute;
      bottom: 6px;
      right: 6px;
      width: 200px;
      height: 200px;
      opacity: 0.01;
      pointer-events: none;
      overflow: hidden;
      z-index: -1;
    }
  </style>
</head>

<body>

  <div class="player-card" id="playerCard" style="position: relative;">
    <div id="autoplayBanner" style="display: none; position: absolute; inset: 0; background: rgba(10, 10, 20, 0.92); backdrop-filter: blur(6px); border-radius: 16px; align-items: center; justify-content: center; z-index: 50; cursor: pointer; text-align: center; padding: 12px;">
      <div style="font-size: 13px; font-weight: 700; color: #38bdf8; display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 20px;">🔊</span> Haz clic para activar audio
      </div>
    </div>

    <div class="thumb-box">
      <img id="trackThumb" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300&auto=format&fit=crop&q=80" alt="Portada">
    </div>
    <div class="song-info">
      <div class="status-badge">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Song Request Audio Player</span>
      </div>
      <div class="song-title" id="trackTitle">Esperando canciones con !sr...</div>
      <div class="song-requester" id="trackRequester">Emite el audio directamente en OBS Studio</div>
    </div>
  </div>

  <!-- Contenedor para YouTube IFrame API -->
  <div id="ytContainer">
    <div id="ytPlayer"></div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const channel = (urlParams.get('channel') || '').toLowerCase().replace(/^#/, '');
    const token = (urlParams.get('token') || urlParams.get('key') || '').trim();

    const trackThumb = document.getElementById('trackThumb');
    const trackTitle = document.getElementById('trackTitle');
    const trackRequester = document.getElementById('trackRequester');
    const statusText = document.getElementById('statusText');
    const statusDot = document.getElementById('statusDot');
    const autoplayBanner = document.getElementById('autoplayBanner');

    let ytPlayer = null;
    let ytApiReady = false;
    let pendingVideoId = null;
    let currentSongData = null;

    // Desbloqueo de audio al hacer clic en cualquier parte (política de navegadores)
    document.body.addEventListener('click', () => {
      if (ytPlayer) {
        if (ytPlayer.unMute) ytPlayer.unMute();
        if (ytPlayer.playVideo) ytPlayer.playVideo();
      }
      if (autoplayBanner) autoplayBanner.style.display = 'none';
    });

    // Inicializar YouTube IFrame Player
    window.onYouTubeIframeAPIReady = function () {
      const initVideoId = pendingVideoId || (currentSongData && currentSongData.videoId) || undefined;
      const playerConfig = {
        height: '200',
        width: '200',
        playerVars: {
          autoplay: 1,
          controls: 0,
          disablekb: 1,
          fs: 0,
          rel: 0,
          enablejsapi: 1,
          origin: window.location.origin
        },
        events: {
          onReady: (event) => {
            ytApiReady = true;
            statusText.innerText = 'Audio Player Conectado';
            try {
              event.target.setVolume(100);
            } catch(e) {}

            if (pendingVideoId) {
              const vid = pendingVideoId;
              pendingVideoId = null;
              playYouTubeVideo(vid);
            }
          },
          onStateChange: (event) => {
            // YT.PlayerState.PLAYING === 1
            if (event.data === 1) {
              statusText.innerText = 'Reproduciendo Audio';
              statusDot.style.background = '#00ff88';
              if (autoplayBanner) autoplayBanner.style.display = 'none';
            }
            // YT.PlayerState.PAUSED === 2
            else if (event.data === 2) {
              statusText.innerText = 'Pausado';
              statusDot.style.background = '#ffb700';
              // Si el navegador pausó automáticamente al inicio (bloqueo de autoplay):
              const curTime = (event.target && event.target.getCurrentTime) ? event.target.getCurrentTime() : 0;
              if (curTime < 1) {
                if (autoplayBanner) autoplayBanner.style.display = 'flex';
                statusText.innerText = 'Autoplay bloqueado - Haz clic para activar';
              }
            }
            // YT.PlayerState.ENDED === 0
            else if (event.data === 0) {
              // PREVENIR SALTO FALSO EN F5: Solo saltar si el video realmente se reprodujo al menos 5 segundos
              const curTime = (event.target && event.target.getCurrentTime) ? event.target.getCurrentTime() : 0;
              if (currentSongData && curTime > 5) {
                statusText.innerText = 'Canción Finalizada';
                notifySongEnded();
              }
            }
          },
          onError: (event) => {
            console.warn('YouTube Audio Player error:', event.data);
            // Solo saltar si es un error irrecuperable de video (100: no encontrado, 101/150: no permitido embeber)
            // NO saltar en error 2 (parámetro de inicio) ni error 5 (error transitorio de HTML5)
            if (currentSongData && (event.data === 100 || event.data === 101 || event.data === 150)) {
              statusText.innerText = 'Video no reproducible en stream - Saltando...';
              setTimeout(() => {
                notifySongEnded();
              }, 3000);
            }
          }
        }
      };

      if (initVideoId) {
        playerConfig.videoId = initVideoId;
      }

      ytPlayer = new YT.Player('ytPlayer', playerConfig);
    };

    function playYouTubeVideo(videoId) {
      if (!videoId) return;
      if (ytPlayer && ytApiReady && ytPlayer.loadVideoById) {
        try {
          ytPlayer.loadVideoById(videoId);
          if (ytPlayer.unMute) ytPlayer.unMute();
          ytPlayer.playVideo();
        } catch (e) {
          console.error('Error al reproducir en YT:', e);
        }
      } else {
        pendingVideoId = videoId;
      }
    }

    function stopYouTubeVideo() {
      pendingVideoId = null;
      if (ytPlayer && ytPlayer.stopVideo) {
        try { ytPlayer.stopVideo(); } catch (e) { }
      }
    }

    function pauseYouTubeVideo() {
      if (ytPlayer && ytPlayer.pauseVideo) {
        try { ytPlayer.pauseVideo(); } catch (e) { }
      }
    }

    function resumeYouTubeVideo() {
      if (ytPlayer && ytPlayer.playVideo) {
        try { ytPlayer.playVideo(); } catch (e) { }
      }
    }

    const songStorageKey = channel ? ('orbibot_current_song_' + channel) : 'orbibot_current_song';

    function notifySongEnded() {
      // 1. Intentar API local pasando canal explícito
      fetch('/api/sr/skip', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ channel })
      }).catch(() => { });

      // 2. BroadcastChannel para sincronizar pestañas locales del mismo streamer
      const chanKey = channel || token;
      if (typeof BroadcastChannel !== 'undefined' && chanKey) {
        try {
          const scopedBc = new BroadcastChannel('orbyxbot_stream_' + chanKey);
          scopedBc.postMessage({ event: 'sr_ended', source: 'obs_audio_player', channel, token });
        } catch(e) {}
      }
    }

    function updateSongDisplay(song) {
      if (!song) {
        trackTitle.innerText = 'Esperando canciones con !sr...';
        trackRequester.innerText = 'La cola de música está vacía';
        try { localStorage.removeItem(songStorageKey); } catch(e) {}
        stopYouTubeVideo();
        return;
      }

      currentSongData = song;
      try { localStorage.setItem(songStorageKey, JSON.stringify(song)); } catch(e) {}
      trackThumb.src = song.thumbnail || 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300&auto=format&fit=crop&q=80';
      trackTitle.innerText = song.title || 'Canción desconocida';
      trackRequester.innerText = `Pedida por @${song.requester || 'Anónimo'}`;

      if (song.videoId) {
        playYouTubeVideo(song.videoId);
      }
    }

    // Cargar estado inicial desde localStorage de inmediato
    try {
      const saved = localStorage.getItem(songStorageKey);
      if (saved) {
        const parsed = JSON.parse(saved);
        if (parsed && parsed.videoId) {
          currentSongData = parsed;
          pendingVideoId = parsed.videoId;
          trackThumb.src = parsed.thumbnail || 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300&auto=format&fit=crop&q=80';
          trackTitle.innerText = parsed.title || 'Cargando canción...';
          trackRequester.innerText = `Pedida por @${parsed.requester || 'Anónimo'}`;
        }
      }
    } catch (e) { }

    // Consultar estado actual del servidor
    const stateUrl = channel ? `/api/sr/state?channel=${encodeURIComponent(channel)}` : '/api/sr/state';
    fetch(stateUrl)
      .then(r => r.json())
      .then(state => {
        if (state && state.currentSong) {
          updateSongDisplay(state.currentSong);
        }
      })
      .catch(() => { });

    const myStreamerKey = channel || '';
    const myToken = token || '';

    // Manejar mensajes entrantes
    function handleIncomingMessage(msg) {
      if (!msg) return;

      // Validación estricta de remitente por canal y token
      if (myStreamerKey || myToken) {
        const targetRoom = (msg.room || msg.channel || msg.data?.channel || msg.data?.room || '').toLowerCase().replace(/^#/, '').trim();
        const targetToken = (msg.token || msg.data?.token || '').trim();

        if (myStreamerKey) {
          if (targetRoom && targetRoom !== 'default' && targetRoom !== myStreamerKey && targetRoom !== myToken) {
            return;
          }
          if (targetRoom === 'default' && myStreamerKey !== 'default') {
            return;
          }
        }
        if (myToken && targetToken && targetToken !== myToken) {
          return;
        }
      } else {
        return;
      }

      if (msg.event === 'init_state' && msg.data?.srState?.currentSong) {
        updateSongDisplay(msg.data.srState.currentSong);
      } else if (msg.event === 'sr_update') {
        const update = msg.data;
        if (update.action === 'play') {
          updateSongDisplay(update.data);
        } else if (update.action === 'skip') {
          updateSongDisplay(update.data?.current);
        } else if (update.action === 'stop') {
          updateSongDisplay(null);
        }
      } else if (msg.event === 'sr_play') {
        updateSongDisplay(msg.data);
      } else if (msg.event === 'sr_stop' || msg.event === 'sr_clear') {
        updateSongDisplay(null);
      } else if (msg.event === 'sr_pause') {
        pauseYouTubeVideo();
      } else if (msg.event === 'sr_resume') {
        resumeYouTubeVideo();
      } else if (msg.event === 'sr_volume') {
        const vol = parseInt(msg.data?.volume, 10);
        if (!isNaN(vol) && ytPlayer && ytPlayer.setVolume) {
          ytPlayer.setVolume(vol);
        }
      }
    }

    // Conexiones de Red y Tiempo Real con Reconexión Automática
    function connectChannels() {
      // 1. Local WebSocket con reconexión automática en segundo plano
      let wsInstance = null;
      let wsReconnectTimeout = null;

      function connectLocalWs(url) {
        if (wsReconnectTimeout) clearTimeout(wsReconnectTimeout);
        try {
          wsInstance = new WebSocket(url);
          wsInstance.onopen = () => {
            if (channel) {
              wsInstance.send(JSON.stringify({ action: 'join', channel, room: channel }));
            }
          };
          wsInstance.onmessage = (event) => {
            try { handleIncomingMessage(JSON.parse(event.data)); } catch (e) { }
          };
          wsInstance.onerror = () => scheduleWsReconnect(url);
          wsInstance.onclose = () => scheduleWsReconnect(url);
        } catch (e) {
          scheduleWsReconnect(url);
        }
      }

      function scheduleWsReconnect(url) {
        if (wsReconnectTimeout) clearTimeout(wsReconnectTimeout);
        wsReconnectTimeout = setTimeout(() => {
          connectLocalWs(url);
        }, 3000);
      }

      const isGitHubPages = location.hostname.endsWith('github.io');
      const wsUrl = !isGitHubPages
        ? `${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}${channel ? '?channel=' + encodeURIComponent(channel) : ''}`
        : 'ws://localhost:3000';

      connectLocalWs(wsUrl);

      // 2. Cloud Real-time Relay (Paho MQTT con Aislamiento Criptográfico)
      let mqttClient = null;
      let mqttReconnectTimeout = null;

      function connectMqtt() {
        if (typeof Paho !== 'undefined') {
          if (mqttReconnectTimeout) clearTimeout(mqttReconnectTimeout);

          if (!channel) return;
          const clientId = 'orbi_audio_' + Math.random().toString(36).substring(2, 9);
          try {
            mqttClient = new Paho.MQTT.Client('broker.emqx.io', 8084, clientId);
            mqttClient.onConnectionLost = (responseObject) => {
              console.warn('MQTT Connection lost, reconnecting in 3.5s...', responseObject);
              scheduleMqttReconnect();
            };
            mqttClient.onMessageArrived = (message) => {
              try {
                const payload = JSON.parse(message.payloadString);
                handleIncomingMessage(payload);
              } catch (e) { }
            };
            mqttClient.connect({
              useSSL: true,
              timeout: 6,
              keepAliveInterval: 30,
              onSuccess: () => {
                if (token) {
                  mqttClient.subscribe(`orbibot/${channel}_${token}/events`);
                } else {
                  mqttClient.subscribe(`orbibot/${channel}/events`);
                }
                statusDot.style.background = 'var(--neon-green)';
                statusText.innerText = 'Audio Player Conectado';
              },
              onFailure: (e) => {
                console.warn('MQTT connect failed, retrying in 4s...', e);
                scheduleMqttReconnect();
              }
            });
          } catch (e) {
            scheduleMqttReconnect();
          }
        }
      }

      function scheduleMqttReconnect() {
        if (mqttReconnectTimeout) clearTimeout(mqttReconnectTimeout);
        mqttReconnectTimeout = setTimeout(connectMqtt, 3500);
      }

      connectMqtt();

      // 3. BroadcastChannel con aislamiento estricto por streamer
      if (typeof BroadcastChannel !== 'undefined' && (myStreamerKey || myToken)) {
        const chanName = myStreamerKey || myToken;
        try {
          const scopedBc = new BroadcastChannel('orbyxbot_stream_' + chanName);
          scopedBc.onmessage = (e) => handleIncomingMessage(e.data);
        } catch(e) {}
      }

      window.addEventListener('storage', (e) => {
        if (myStreamerKey && e.key === ('orbibot_last_event_' + myStreamerKey) && e.newValue) {
          try { handleIncomingMessage(JSON.parse(e.newValue)); } catch (err) { }
        }
        if (myToken && e.key === ('orbibot_last_event_' + myToken) && e.newValue) {
          try { handleIncomingMessage(JSON.parse(e.newValue)); } catch (err) { }
        }
      });

      // 4. OBS Scene Activate & Visibility Health Watcher
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
          if (!wsInstance || wsInstance.readyState !== WebSocket.OPEN) {
            connectLocalWs(wsUrl);
          }
          if (!mqttClient || !mqttClient.isConnected()) {
            connectMqtt();
          }
        }
      });

      // 5. Chequeo periódico de salud en segundo plano cada 15s
      setInterval(() => {
        const wsOpen = wsInstance && wsInstance.readyState === WebSocket.OPEN;
        const mqttOpen = mqttClient && mqttClient.isConnected();
        if (!wsOpen && !mqttOpen) {
          connectLocalWs(wsUrl);
          connectMqtt();
        }
      }, 15000);
    }

    connectChannels();
  </script>
</body>

</html>
