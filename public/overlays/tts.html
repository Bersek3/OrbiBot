<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>OBS TTS Audio Player</title>
  <link rel="stylesheet" href="../css/overlays.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  <style>
    .tts-indicator {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(14, 18, 28, 0.9);
      border: 1px solid var(--primary-purple);
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 13px;
      color: #fff;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .tts-indicator.active {
      opacity: 1;
    }
    .tts-wave {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 14px;
    }
    .tts-wave-bar {
      width: 3px;
      height: 100%;
      background: var(--neon-cyan);
      border-radius: 2px;
      animation: eqBounce 0.8s infinite ease-in-out;
    }
  </style>
</head>
<body>
  <div id="ttsIndicator" class="tts-indicator">
    <div class="tts-wave">
      <div class="tts-wave-bar" style="animation-delay: 0.1s"></div>
      <div class="tts-wave-bar" style="animation-delay: 0.2s"></div>
      <div class="tts-wave-bar" style="animation-delay: 0.3s"></div>
    </div>
    <span id="ttsUser">Voz en stream...</span>
  </div>

  <script>
    const ttsIndicator = document.getElementById('ttsIndicator');
    const ttsUser = document.getElementById('ttsUser');

    const queue = [];
    let isSpeaking = false;

    function processQueue() {
      if (isSpeaking || queue.length === 0) return;
      isSpeaking = true;

      const item = queue.shift();
      ttsIndicator.classList.add('active');
      ttsUser.innerText = `TTS: ${item.user}`;

      let finished = false;
      // Safety timeout: si el audio no termina en 10s, forzar el avance de la cola
      const safetyTimer = setTimeout(() => {
        if (!finished) {
          console.warn('TTS safety timeout reached, advancing queue');
          finalize();
        }
      }, 10000);

      function finalize() {
        if (finished) return;
        finished = true;
        clearTimeout(safetyTimer);
        finishSpeaking();
      }

      const SE_VOICE_MAP = {
        // Español Latino
        es_mx_mia: 'Mia',
        mia: 'Mia',
        es_us_miguel: 'Miguel',
        miguel: 'Miguel',
        es_us_lupe: 'Lupe',
        lupe: 'Lupe',
        es_us_penelope: 'Penelope',
        penelope: 'Penelope',
        penélope: 'Penelope',

        // Español España / Castellano
        es_es_enrique: 'Enrique',
        enrique: 'Enrique',
        es_es_conchita: 'Conchita',
        conchita: 'Conchita',
        es_es_lucia: 'Lucia',
        lucia: 'Lucia',
        lucía: 'Lucia',

        // English
        en_brian: 'Brian',
        brian: 'Brian',
        en_emma: 'Emma',
        emma: 'Emma',
        en_joey: 'Joey',
        joey: 'Joey',
        en_matthew: 'Matthew',
        matthew: 'Matthew',
        en_kendra: 'Kendra',
        kendra: 'Kendra',
        en_justin: 'Justin',
        justin: 'Justin',
        en_russell: 'Russell',
        russell: 'Russell',

        // Internacionales
        pt_cristiano: 'Cristiano',
        cristiano: 'Cristiano',
        fr_mathieu: 'Mathieu',
        mathieu: 'Mathieu',
        it_giorgio: 'Giorgio',
        giorgio: 'Giorgio',
        de_hans: 'Hans',
        hans: 'Hans',
        ja_takumi: 'Takumi',
        takumi: 'Takumi',
        ja_mizuki: 'Mizuki',
        mizuki: 'Mizuki',

        // Fallbacks
        es_001: 'Mia',
        es_female: 'Mia',
        es_male: 'Miguel',
        es_002: 'Conchita',
        'es-es-standard-a': 'Enrique',
        en_001: 'Brian',
        en_002: 'Emma'
      };

      function getVoiceName(vId) {
        if (!vId) return 'Mia';
        const clean = vId.toString().toLowerCase().trim().replace(/^[-@/]/, '').replace(/^voice:/, '');
        return SE_VOICE_MAP[clean] || SE_VOICE_MAP[vId] || 'Mia';
      }

      // 1. Prioridad: Audio streaming nativo con la voz exacta seleccionada (StreamElements / Google TTS)
      const voiceName = getVoiceName(item.voice);
      const primaryUrl = (item.text ? `https://api.streamelements.com/kappa/v2/speech?voice=${encodeURIComponent(voiceName)}&text=${encodeURIComponent(item.text)}` : null) || item.audioUrl;
      const secondaryUrl = item.fallbackUrl || (item.text ? `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(item.text)}&tl=es&client=tw-ob` : null);

      if (primaryUrl) {
        const audio = new Audio(primaryUrl);
        audio.volume = item.volume !== undefined ? item.volume : 0.9;
        audio.onended = () => finalize();
        audio.onerror = () => {
          console.warn('Primary TTS audio failed, trying fallback');
          playFallback();
        };

        const playPromise = audio.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {
            playFallback();
          });
        }
        return;
      }

      function playFallback() {
        if (secondaryUrl) {
          const fbAudio = new Audio(secondaryUrl);
          fbAudio.volume = item.volume !== undefined ? item.volume : 0.9;
          fbAudio.onended = () => finalize();
          fbAudio.onerror = () => speakWebSpeech(item, finalize);
          const fbPromise = fbAudio.play();
          if (fbPromise !== undefined) {
            fbPromise.catch(() => speakWebSpeech(item, finalize));
          }
        } else {
          speakWebSpeech(item, finalize);
        }
      }
    }

    function speakWebSpeech(item, onDone) {
      if (!('speechSynthesis' in window)) {
        if (onDone) onDone();
        return;
      }

      try {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(item.text);
        utterance.volume = item.volume !== undefined ? item.volume : 0.9;
        utterance.rate = item.rate || 1.0;
        utterance.pitch = item.pitch || 1.0;

        const voices = window.speechSynthesis.getVoices();
        const vKey = (item.voice || '').toLowerCase();
        let selectedVoice = null;

        if (vKey.includes('miguel') || vKey.includes('enrique') || vKey.includes('male') || vKey.includes('joey') || vKey.includes('brian') || vKey.includes('matthew') || vKey.includes('justin') || vKey.includes('hans') || vKey.includes('takumi') || vKey.includes('cristiano') || vKey.includes('giorgio') || vKey.includes('mathieu')) {
          selectedVoice = voices.find(v => (v.name.includes('Male') || v.name.includes('David') || v.name.includes('Pablo') || v.name.includes('Alvaro') || v.name.includes('Raul') || v.name.includes('Jorge') || v.name.includes('Enrique') || v.name.includes('Guy') || v.name.includes('Stefan') || v.name.includes('Cosimo') || v.name.includes('Keita')) && (vKey.startsWith('en') ? v.lang.startsWith('en') : v.lang.startsWith('es')));
        } else {
          selectedVoice = voices.find(v => (v.name.includes('Female') || v.name.includes('Zira') || v.name.includes('Sabina') || v.name.includes('Helena') || v.name.includes('Laura') || v.name.includes('Monica') || v.name.includes('Mia') || v.name.includes('Lucia') || v.name.includes('Conchita')) && (vKey.startsWith('en') ? v.lang.startsWith('en') : v.lang.startsWith('es')));
        }

        if (!selectedVoice) {
          if (vKey.startsWith('en')) selectedVoice = voices.find(v => v.lang.startsWith('en'));
          else if (vKey.startsWith('pt')) selectedVoice = voices.find(v => v.lang.startsWith('pt'));
          else if (vKey.startsWith('fr')) selectedVoice = voices.find(v => v.lang.startsWith('fr'));
          else if (vKey.startsWith('it')) selectedVoice = voices.find(v => v.lang.startsWith('it'));
          else if (vKey.startsWith('de')) selectedVoice = voices.find(v => v.lang.startsWith('de'));
          else if (vKey.startsWith('ja')) selectedVoice = voices.find(v => v.lang.startsWith('ja'));
          else selectedVoice = voices.find(v => v.lang.startsWith('es'));
        }

        if (selectedVoice) {
          utterance.voice = selectedVoice;
        }

        utterance.onend = () => { if (onDone) onDone(); };
        utterance.onerror = () => { if (onDone) onDone(); };

        window.speechSynthesis.speak(utterance);
      } catch(e) {
        if (onDone) onDone();
      }
    }

    function finishSpeaking() {
      ttsIndicator.classList.remove('active');
      setTimeout(() => {
        isSpeaking = false;
        processQueue();
      }, 400);
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }

    const processedTtsIds = new Set();
    function isDuplicateTts(msg) {
      if (!msg) return true;
      const data = msg.data || msg;
      const eventId = msg.id || data.id || `tts_${data.user || ''}_${data.text || ''}_${Math.floor((msg.timestamp || data.timestamp || Date.now()) / 3500)}`;
      
      if (processedTtsIds.has(eventId)) {
        return true;
      }
      processedTtsIds.add(eventId);
      setTimeout(() => {
        processedTtsIds.delete(eventId);
      }, 15000);
      return false;
    }

    function handleIncomingMessage(msg) {
      if (!msg) return;
      if (msg.event === 'tts') {
        if (isDuplicateTts(msg)) return;
        queue.push(msg.data);
        processQueue();
      }
    }

    function connectChannels() {
      const urlParams = new URLSearchParams(window.location.search);
      const channel = (urlParams.get('channel') || '').toLowerCase().replace(/^#/, '');
      const token = (urlParams.get('token') || urlParams.get('key') || '').trim();

      // 1. Local WebSocket con reconexión automática en segundo plano
      let wsInstance = null;
      let wsReconnectTimeout = null;

      function connectLocalWs(url) {
        if (wsReconnectTimeout) clearTimeout(wsReconnectTimeout);
        try {
          wsInstance = new WebSocket(url);
          wsInstance.onopen = () => {
            const targetRoom = channel || token;
            if (targetRoom) {
              wsInstance.send(JSON.stringify({ action: 'join', room: targetRoom }));
            }
          };
          wsInstance.onmessage = (event) => {
            try { handleIncomingMessage(JSON.parse(event.data)); } catch(e) {}
          };
          wsInstance.onerror = () => scheduleWsReconnect(url);
          wsInstance.onclose = () => scheduleWsReconnect(url);
        } catch(e) {
          scheduleWsReconnect(url);
        }
      }

      function scheduleWsReconnect(url) {
        if (wsReconnectTimeout) clearTimeout(wsReconnectTimeout);
        wsReconnectTimeout = setTimeout(() => {
          connectLocalWs(url);
        }, 3000);
      }

      const isGitHubPages = location.hostname.endsWith('github.io');
      const wsUrl = !isGitHubPages
        ? `${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}`
        : 'ws://localhost:3000';

      connectLocalWs(wsUrl);

      // 2. Cloud Real-time Relay (Paho MQTT) con reconexión automática
      let mqttClient = null;
      let mqttReconnectTimeout = null;

      function connectMqtt() {
        if (typeof Paho === 'undefined') return;
        if (mqttReconnectTimeout) clearTimeout(mqttReconnectTimeout);

        if (!channel) return;
        const clientId = 'orbi_tts_' + Math.random().toString(36).substring(2, 9);
        try {
          mqttClient = new Paho.MQTT.Client('broker.emqx.io', 8084, clientId);
          mqttClient.onConnectionLost = (responseObject) => {
            console.warn('MQTT Connection lost, reconnecting in 3.5s...', responseObject);
            scheduleMqttReconnect();
          };
          mqttClient.onMessageArrived = (message) => {
            try {
              const payload = JSON.parse(message.payloadString);
              handleIncomingMessage(payload);
            } catch(e) {}
          };
          mqttClient.connect({
            useSSL: true,
            timeout: 6,
            keepAliveInterval: 30,
            onSuccess: () => {
              if (token) {
                mqttClient.subscribe(`orbibot/${channel}_${token}/events`);
              } else {
                mqttClient.subscribe(`orbibot/${channel}/events`);
              }
            },
            onFailure: (e) => {
              console.warn('MQTT connect failed, retrying in 4s...', e);
              scheduleMqttReconnect();
            }
          });
        } catch(e) {
          scheduleMqttReconnect();
        }
      }

      function scheduleMqttReconnect() {
        if (mqttReconnectTimeout) clearTimeout(mqttReconnectTimeout);
        mqttReconnectTimeout = setTimeout(connectMqtt, 3500);
      }

      connectMqtt();

      // 3. BroadcastChannel & Storage for same-browser testing
      if (typeof BroadcastChannel !== 'undefined') {
        const bc = new BroadcastChannel('orbibot_stream_channel');
        bc.onmessage = (e) => handleIncomingMessage(e.data);
      }

      window.addEventListener('storage', (e) => {
        if (e.key === 'orbibot_last_event' && e.newValue) {
          try { handleIncomingMessage(JSON.parse(e.newValue)); } catch (err) {}
        }
      });

      // 4. OBS Scene Activate & Visibility Health Watcher
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
          if (!wsInstance || wsInstance.readyState !== WebSocket.OPEN) {
            connectLocalWs(wsUrl);
          }
          if (!mqttClient || !mqttClient.isConnected()) {
            connectMqtt();
          }
        }
      });

      // 5. Chequeo periódico de salud en segundo plano cada 15s
      setInterval(() => {
        const wsOpen = wsInstance && wsInstance.readyState === WebSocket.OPEN;
        const mqttOpen = mqttClient && mqttClient.isConnected();
        if (!wsOpen && !mqttOpen) {
          connectLocalWs(wsUrl);
          connectMqtt();
        }
      }, 15000);
    }

    connectChannels();
  </script>
</body>
</html>
