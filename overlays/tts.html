<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>OBS TTS Audio Player</title>
  <link rel="stylesheet" href="../css/overlays.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  <style>
    .tts-indicator {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(14, 18, 28, 0.9);
      border: 1px solid var(--primary-purple);
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 13px;
      color: #fff;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .tts-indicator.active {
      opacity: 1;
    }
    .tts-wave {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 14px;
    }
    .tts-wave-bar {
      width: 3px;
      height: 100%;
      background: var(--neon-cyan);
      border-radius: 2px;
      animation: eqBounce 0.8s infinite ease-in-out;
    }
  </style>
</head>
<body>
  <div id="ttsIndicator" class="tts-indicator">
    <div class="tts-wave">
      <div class="tts-wave-bar" style="animation-delay: 0.1s"></div>
      <div class="tts-wave-bar" style="animation-delay: 0.2s"></div>
      <div class="tts-wave-bar" style="animation-delay: 0.3s"></div>
    </div>
    <span id="ttsUser">Voz en stream...</span>
  </div>

  <script>
    const ttsIndicator = document.getElementById('ttsIndicator');
    const ttsUser = document.getElementById('ttsUser');

    const queue = [];
    let isSpeaking = false;

    function processQueue() {
      if (isSpeaking || queue.length === 0) return;
      isSpeaking = true;

      const item = queue.shift();
      ttsIndicator.classList.add('active');
      ttsUser.innerText = `TTS: ${item.user}`;

      let finished = false;
      // Safety timeout: si el audio no termina en 10s, forzar el avance de la cola
      const safetyTimer = setTimeout(() => {
        if (!finished) {
          console.warn('TTS safety timeout reached, advancing queue');
          finalize();
        }
      }, 10000);

      function finalize() {
        if (finished) return;
        finished = true;
        clearTimeout(safetyTimer);
        finishSpeaking();
      }

      // 1. Prioridad: Audio streaming nativo (StreamElements / Google TTS)
      const primaryUrl = item.audioUrl || (item.text ? `https://api.streamelements.com/kappa/v2/speech?voice=Mia&text=${encodeURIComponent(item.text)}` : null);
      const secondaryUrl = item.fallbackUrl || (item.text ? `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(item.text)}&tl=es&client=tw-ob` : null);

      if (primaryUrl) {
        const audio = new Audio(primaryUrl);
        audio.volume = item.volume !== undefined ? item.volume : 0.9;
        audio.onended = () => finalize();
        audio.onerror = () => {
          console.warn('Primary TTS audio failed, trying fallback');
          playFallback();
        };

        const playPromise = audio.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {
            playFallback();
          });
        }
        return;
      }

      function playFallback() {
        if (secondaryUrl) {
          const fbAudio = new Audio(secondaryUrl);
          fbAudio.volume = item.volume !== undefined ? item.volume : 0.9;
          fbAudio.onended = () => finalize();
          fbAudio.onerror = () => speakWebSpeech(item, finalize);
          const fbPromise = fbAudio.play();
          if (fbPromise !== undefined) {
            fbPromise.catch(() => speakWebSpeech(item, finalize));
          }
        } else {
          speakWebSpeech(item, finalize);
        }
      }
    }

    function speakWebSpeech(item, onDone) {
      if (!('speechSynthesis' in window)) {
        if (onDone) onDone();
        return;
      }

      try {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(item.text);
        utterance.volume = item.volume !== undefined ? item.volume : 0.9;
        utterance.rate = item.rate || 1.0;
        utterance.pitch = item.pitch || 1.0;

        const voices = window.speechSynthesis.getVoices();
        const spanishVoice = voices.find(v => v.lang.startsWith('es') || v.name.includes('Spanish'));
        if (spanishVoice) {
          utterance.voice = spanishVoice;
        }

        utterance.onend = () => { if (onDone) onDone(); };
        utterance.onerror = () => { if (onDone) onDone(); };

        window.speechSynthesis.speak(utterance);
      } catch(e) {
        if (onDone) onDone();
      }
    }

    function finishSpeaking() {
      ttsIndicator.classList.remove('active');
      setTimeout(() => {
        isSpeaking = false;
        processQueue();
      }, 400);
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }

    function handleIncomingMessage(msg) {
      if (!msg) return;
      if (msg.event === 'tts') {
        queue.push(msg.data);
        processQueue();
      }
    }

    function connectChannels() {
      const urlParams = new URLSearchParams(window.location.search);
      const channel = (urlParams.get('channel') || '').toLowerCase().replace(/^#/, '');
      const token = (urlParams.get('token') || urlParams.get('key') || '').trim();

      // 1. Cloud Real-time Relay (Paho MQTT)
      if (typeof Paho !== 'undefined') {
        const relayChannel = channel || 'general';
        const clientId = 'orbi_tts_' + Math.random().toString(36).substring(2, 9);
        try {
          const mqttClient = new Paho.MQTT.Client('broker.emqx.io', 8084, clientId);
          mqttClient.onMessageArrived = (message) => {
            try {
              const payload = JSON.parse(message.payloadString);
              handleIncomingMessage(payload);
            } catch(e) {}
          };
          mqttClient.connect({
            useSSL: true,
            timeout: 6,
            onSuccess: () => {
              if (token && relayChannel !== 'general') {
                mqttClient.subscribe(`orbibot/${relayChannel}_${token}/events`);
              }
              mqttClient.subscribe(`orbibot/${relayChannel}/events`);
            }
          });
        } catch(e) {}
      }

      // 2. Local WebSocket Server
      function connectLocalWs(url) {
        try {
          const ws = new WebSocket(url);
          ws.onmessage = (event) => {
            try { handleIncomingMessage(JSON.parse(event.data)); } catch(e) {}
          };
        } catch(e) {}
      }

      const isGitHubPages = location.hostname.endsWith('github.io');
      if (!isGitHubPages) {
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        connectLocalWs(`${protocol}//${location.host}`);
      } else {
        connectLocalWs('ws://localhost:3000');
        connectLocalWs('ws://127.0.0.1:3000');
      }

      // 3. BroadcastChannel & Storage for same-browser testing
      if (typeof BroadcastChannel !== 'undefined') {
        const bc = new BroadcastChannel('orbibot_stream_channel');
        bc.onmessage = (e) => handleIncomingMessage(e.data);
      }

      window.addEventListener('storage', (e) => {
        if (e.key === 'orbibot_last_event' && e.newValue) {
          try { handleIncomingMessage(JSON.parse(e.newValue)); } catch (err) {}
        }
      });
    }

    connectChannels();
  </script>
</body>
</html>
